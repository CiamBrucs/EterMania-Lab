/* Incorporación ontológica: P_A + P_B → P_AB con m_AB = m_A + m_B */
function incorporate(host, guest){
  const mIn=guest.mass;
  host.mass+=mIn;
  host.charge=(host.charge||0)+(guest.charge||0)*0.5;
  host.sigma=Math.min(0.14, host.sigma*0.85+guest.sigma*0.35);
  host.relEnergy=(host.relEnergy||0)+(guest.relEnergy||0)+0.12*mIn;
  host.memory=(host.memory||0)+1+(guest.memory||0);
  const hostComp=host.composition||[{kind:host.kind, mass:host.mass-mIn}];
  const guestComp=guest.composition||[{kind:guest.kind, mass:mIn}];
  host.composition=hostComp.concat(guestComp).slice(-24); // historia limitada
  if(guest.lineage&&!host.lineage) host.lineage=guest.lineage;
  if(guest._fromSplit&&!host._fromSplit) host._fromSplit=guest._fromSplit;
  // tamaño visual fijo; la incorporación refuerza vínculos nacientes del anfitrión
  host._radiusScale=1;
  strengthenNascentLinks(host, 0.04+0.02*mIn);
}


function absorbParticle(guest){
  const gi=particles.indexOf(guest);
  if(gi>=0) particles.splice(gi,1);
  trails.delete(guest.id);
  for(const k of [...softLinks.keys()])
    if(k.startsWith(guest.id+'-')||k.endsWith('-'+guest.id)) softLinks.delete(k);
}

function rehomeOverflow(old){
  // no borrar materia: fusionar en el vecino más cercano o al residual de campo
  let best=null, bestD=1e9;
  for(const p of particles){
    if(p===old) continue;
    const d=Math.hypot(p.x-old.x,p.y-old.y,p.z-old.z);
    if(d<bestD){ bestD=d; best=p; }
  }
  if(best){
    incorporate(best, old);
    absorbParticle(old);
    log('Reorganización · masa conservada en #'+best.id);
  } else {
    residualMass+=old.mass;
    absorbParticle(old);
  }
}

function spawn(nx,ny,nz,kind=placeKind, extra={}){
  if(!kindMeta[kind]) kind='e';
  const m=kindMeta[kind];
  const baseMass=m.mass*(extra.massScale||1);
  const mass0=extra.mass!=null?extra.mass:baseMass;
  const z0=(typeof nz==='number'&&!Number.isNaN(nz))?nz:(0.4+Math.random()*0.2);
  const p={
    id:nextId++,
    x:nx,y:ny,z:z0,
    vx:extra.vx??(Math.random()-0.5)*0.04,
    vy:extra.vy??(Math.random()-0.5)*0.04,
    vz:extra.vz??(Math.random()-0.5)*0.03,
    mass:mass0,
    phase:Math.random()*Math.PI*2,
    freq:m.freq*(0.9+Math.random()*0.2),
    sigma:m.spread*(0.9+Math.random()*0.2)*hbar,
    kind, hue:m.hue+(Math.random()-0.5)*12,
    charge:extra.charge!=null?extra.charge:m.charge,
    entangledWith:extra.entangledWith??null,
    amp:1,
    spawnTime:time,
    decayAt:null, // fundamentales: no se dividen ni devienen otras
    crystallized:false, moleculeId:null, crystalStreak:0, fissionCooldownUntil:0, _radiusScale:1,
    synthStreak:0,
    vibratePhase:Math.random()*Math.PI*2,
    ax:0, ay:0, az:0,
    composition: extra.composition||[{kind, mass: mass0}],
    relEnergy: extra.relEnergy||0,
    memory: extra.memory||0,
    _radiusScale:Math.pow(mass0/Math.max(0.3,m.mass),1/3),
  };
  particles.push(p);
  impulse=Math.min(1,impulse+0.15);
  noteEmission(nx, ny, z0, 0.55, 'spawn');
  emitDust(nx,ny,z0,5,0.02);
  // tope de N: reorganizar sin borrar masa (máx. unas pocas pasadas)
  let guard=8;
  while(particles.length>MAX_PARTICLES && guard-- >0){
    const old=particles[0]===p&&particles.length>1?particles[1]:particles[0];
    if(!old||old===p&&particles.length===1) break;
    rehomeOverflow(old);
  }
  log('Despierta '+m.name+' #'+p.id);
  return p;
}

function clearAll(){
  cascadeState.waveFissions=0; cascadeState.totalFissions=0; cascadeState.log=[]; cascadeState.hot=false;

  // disipar ≠ destruir: la masa pasa al residual de campo
  residualMass+=particles.reduce((s,p)=>s+p.mass,0);
  particles.length=0; softLinks.clear(); barriers=[]; interf.fill(0); tunnelFlashes=[]; trails.clear();
  faceWaves=[]; cubeHits=[]; dustMotes.length=0; fagoDwell.clear();
  playerId=null;
  doubleSlitStats={active:false, rearHits:0, bins:new Array(24).fill(0), lastLog:0};
  observerEmit.strength=0; observerEmit.life=0; observerEmit.kind='hito';
  log('El éter se aquieta · residual Σm='+residualMass.toFixed(2));
}

function inBarrier(x,y,z){
  for(const b of barriers){
    if(x>=b.x0&&x<=b.x1&&y>=b.y0&&y<=b.y1&&z>=b.z0&&z<=b.z1) return true;
  }
  return false;
}

function updateSoftLinks(){
  /* Umbral por debajo de su media → ensamblaje (vínculos más fuertes, alcance efectivo mayor).
     Por encima → dispersión (vínculos más débiles, alcance menor).
     El objetivo es que bajo media se formen moles (moléculas) de forma natural. */
  const assembleBias=scale<SCALE_MEAN ? (SCALE_MEAN-scale)/SCALE_MEAN : 0; // 0..1
  const disperseBias=scale>SCALE_MEAN ? (scale-SCALE_MEAN)/(1-SCALE_MEAN) : 0;
  const reachEff=reach*(1+assembleBias*0.85)*(1-disperseBias*0.4);
  const strengthMul=1+assembleBias*2.0-disperseBias*0.65;

  const desired=new Set();
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const a=particles[i], b=particles[j];
      const dist=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
      if(dist>reachEff) continue;
      let phaseAlign=0.5+0.5*Math.cos(a.phase-b.phase);
      if(a.entangledWith===b.id||b.entangledWith===a.id) phaseAlign=Math.max(phaseAlign,0.85);
      const massAff=1-Math.abs(a.mass-b.mass)/Math.max(a.mass,b.mass,1)*0.3;
      // opuestos se atraen (enlace); mismo signo casi no forman vínculo (se repelen)
      const qq=(a.charge||0)*(b.charge||0);
      const chargeAff=qq<0?1.45:qq>0?0.15:1.0;
      const molBonus=(a.moleculeId&&a.moleculeId===b.moleculeId)?1.4:1;
      const lin=sameLineage(a,b);
      const lineageBonus=lin?1.65:1;
      // en dispersión (umbral alto) los vínculos se debilitan más
      const strength=(1-dist/reachEff)*phaseAlign*massAff*chargeAff*molBonus*lineageBonus*strengthMul;
      // cargas iguales: sin vínculo, salvo linaje compartido o mismo mole
      if(qq>0 && !molBonus && !lin) continue;
      /* Termodinámica: umbral de desired sube con kT (ΔF_lazo → 0 ⇒ menos ocupación) */
      const kTform=langevinOn?langevinKT:langevinKT*0.35;
      const strengthFloor=0.12+0.10*Math.min(1,kTform/0.10)+0.06*disperseBias
        +0.05*(thermalHys.residual||0)*(thermalHys.wasHot?1:0.4);
      if(strength<strengthFloor) continue;
      const k=linkKey(a.id,b.id);
      desired.add(k);
      if(!softLinks.has(k)) softLinks.set(k,{a:a.id,b:b.id,alpha:0,target:0,lineage:!!lin});
      const L=softLinks.get(k);
      L.lineage=!!lin;
      // k_on efectivo: strength × (1 - 0.28 kT/0.1) — estudio termo
      const tMul=1-0.28*Math.min(1,kTform/0.10);
      const konBoost=1+assembleBias*0.35;
      L.target=Math.min(lin?0.48:0.38,(0.04+strength*0.28)*Math.max(0.55,tMul)*konBoost);
    }
  }
  const disperseBias2=scale>SCALE_MEAN ? (scale-SCALE_MEAN)/(1-SCALE_MEAN) : 0;
  const impulseEff=getImpulseEff();

  function clearCoroIfIsolated(p){
    if(!p) return;
    let still=false;
    for(const L2 of softLinks.values()){
      if(!L2.stuck) continue;
      if(L2.a===p.id||L2.b===p.id){ still=true; break; }
    }
    if(!still){
      if(p.moleculeId||p.crystallized){
        p.crystallized=false; p.moleculeId=null; p.crystalStreak=0;
      }
    }
  }

  for(const [k,L] of softLinks){
    const inDes=desired.has(k);

    /* Temperatura (fervor kT): k_off ~ kT + kT² + disperse + marea
       → fatiga de stuck y menor target; coros menos estables al calor. */
    const kT = langevinOn ? langevinKT : langevinKT * 0.35;
    const thermalOff = 0.05 + 2.2 * kT + 4.0 * kT * kT;
    const mareaPush = Math.max(0, (impulseEff - 0.25) * 0.35);
    // Histéresis: calentar agrava daño; residual mantiene metaestabilidad al enfriar
    const heatMul = thermalHys.dir>0 ? 1.35 : (thermalHys.dir<0 ? 0.92 : 1);
    const resMul = 1 + 0.55 * (thermalHys.residual||0);

    // Fatiga incluso en desired: velo dispersivo + calor
    if(inDes && L.stuck){
      if(disperseBias2>0.22){
        L.target=Math.max(0.14, (L.target||0.3)*(1-0.015*disperseBias2));
        L._fatigue=(L._fatigue||0)+0.012*disperseBias2;
      }
      if(kT>0.008){
        L._fatigue=(L._fatigue||0)+(0.018*(kT/0.04)+0.012*thermalOff)*heatMul*resMul;
        L.target=Math.max(0.12, (L.target||0.35)*(1-0.01*(kT/0.06)));
      }
    }

    if(!inDes){
      if(L.stuck){
        const hard=disperseBias2>=STUCK_BREAK_BIAS||impulseEff>=FISSION_IMPULSE;
        const softZone=disperseBias2>=STUCK_BREAK_BIAS*0.45||impulseEff>=FISSION_IMPULSE*0.55||kT>0.045;
        // umbral de fatiga baja con temperatura (más fácil romper al calor)
        const fatigueNeed=STUCK_FATIGUE_NEED*(1-0.45*Math.min(1,kT/0.10))
          *(thermalHys.dir>0?0.88:1)*(1-0.20*(thermalHys.residual||0));
        if(hard || (L._fatigue||0)>=fatigueNeed){
          if(L.stuckSince!=null&&typeof recordStuckLifetime==='function') recordStuckLifetime(time-L.stuckSince);
          L.stuck=false;
          L._fatigue=0;
          L.target=0;
          L.stuckSince=null;
          const byId=new Map(particles.map(p=>[p.id,p]));
          const pa=byId.get(L.a), pb=byId.get(L.b);
          clearCoroIfIsolated(pa);
          clearCoroIfIsolated(pb);
          if(typeof notePlay==='function') notePlay('dissolve');
        } else if(softZone || kT>0.025){
          const stress=Math.max(
            disperseBias2/STUCK_BREAK_BIAS,
            impulseEff/FISSION_IMPULSE,
            thermalOff*2.5,
            mareaPush
          );
          L.target=Math.max(0.06, (L.target||0.35)*(1-0.04*stress));
          L._fatigue=(L._fatigue||0)+0.05*stress+0.03*thermalOff;
        } else {
          L.target=Math.max(L.target||0, 0.32);
          L._fatigue=Math.max(0,(L._fatigue||0)-0.02);
        }
      } else {
        L.target=0;
        L._fatigue=0;
      }
    } else {
      /* Recuperación asimétrica: al enfriar, residual y wasHot frenan la cura
         → kT_on < kT_off (lazo de histéresis). */
      const coolFactor = (thermalHys.wasHot||(thermalHys.residual||0)>0.15)
        ? (0.35+0.65*Math.max(0,1-(thermalHys.residual||0)))
        : 1;
      if(disperseBias2<0.12 && kT<0.03)
        L._fatigue=Math.max(0,(L._fatigue||0)-0.035*(1-kT/0.045)*coolFactor);
      else if(disperseBias2<0.18 && kT<0.05)
        L._fatigue=Math.max(0,(L._fatigue||0)-0.018*coolFactor);
      else if(kT>=0.05)
        L._fatigue=Math.max(0,(L._fatigue||0)-0.006*coolFactor);
    }

    // decaimiento de alpha: más rápido al disolverse
    const rate=(L.target===0&&!L.stuck)?0.30:(L.stuck?0.16:0.14);
    L.alpha+=(L.target-L.alpha)*rate;
    if(L.alpha<0.008&&L.target===0&&!L.stuck) softLinks.delete(k);
  }
}

function ensureSet(map,k){ if(!map.has(k)) map.set(k,new Set()); return map.get(k); }

function updateMolecules(byId){
  const strongNb=new Map();
  for(const L of softLinks.values()){
    if(L.alpha<CRYSTAL_ALPHA) continue;
    // Nivel 2: sólo átomos ya sintetizados cristalizan en molécula (no subpartículas sueltas)
    const pa=byId.get(L.a), pb=byId.get(L.b);
    if(!pa||!pb||!ATOM_TIER_KINDS.has(pa.kind)||!ATOM_TIER_KINDS.has(pb.kind)) continue;
    ensureSet(strongNb,L.a).add(L.b);
    ensureSet(strongNb,L.b).add(L.a);
  }
  /* Bajo umbral media basta un vecino fuerte (dímero) para empezar a cristalizar;
     por encima se exige cluster de 3 como antes. */
  const assembleBias=scale<SCALE_MEAN ? (SCALE_MEAN-scale)/SCALE_MEAN : 0;
    const minNeighbors=assembleBias>0.25 ? 1 : 2;
  const kTm=langevinOn?langevinKT:langevinKT*0.35;
  // Rama de enfriamiento: residual sube la barrera de nucleación (histéresis)
  const hysBarrier=1-0.40*(thermalHys.residual||0)*(thermalHys.dir<0||thermalHys.wasHot?1:0.5);
  const streakGain=Math.max(0.015, (0.055+assembleBias*0.06-0.15*kTm)*hysBarrier);
  const streakDecay=0.055+0.12*kTm+0.04*(thermalHys.residual||0);

  for(const e of particles){
    const nb=strongNb.get(e.id);
    const inCluster = nb && nb.size>=minNeighbors && time>=(e.fissionCooldownUntil||0);
    if(inCluster){
      // renucleación: tras cooldown, bonus leve de streak si el medio sigue vinculante
      const reBonus=(e.fissionCooldownUntil&&time<e.fissionCooldownUntil+1.2)?assembleBias*0.04:0;
      e.crystalStreak=(e.crystalStreak||0)+streakGain+reBonus;
      if(e.crystalStreak>=CRYSTAL_TIME && !e.crystallized){
        e.crystallized=true;
        let inherited=null;
        for(const nid of nb){
          const other=byId.get(nid);
          if(other&&other.crystallized&&other.moleculeId){ inherited=other.moleculeId; break; }
        }
        e.moleculeId=inherited||('mol'+(nextId++));
        // arrastra vecinos fuertes al mismo mole
        for(const nid of nb){
          const other=byId.get(nid);
          if(other&&!other.moleculeId){
            other.moleculeId=e.moleculeId;
            other.crystallized=true;
            other.crystalStreak=CRYSTAL_TIME;
          }
        }
        spawnFlash(e.x,e.y,e.z,48,1.25,'crystal');
        emitDust(e.x,e.y,e.z,4,0.015);
        if(typeof notePlay==='function') notePlay('chorus');
      }
      // cohesión suave hacia el centro del mole (mantiene la molécula junta)
      if(e.crystallized&&e.moleculeId&&nb){
        let cx=0,cy=0,cz=0,n=0;
        for(const nid of nb){
          const o=byId.get(nid);
          if(!o) continue;
          cx+=o.x; cy+=o.y; cz+=o.z; n++;
        }
        if(n>0){
          cx/=n; cy/=n; cz/=n;
          // cohesión débil: el potencial angular define la forma 3D
          const pull=0.0045;
          e.vx+=(cx-e.x)*pull; e.vy+=(cy-e.y)*pull; e.vz+=(cz-e.z)*pull;
        }
      }
    } else {
      e.crystalStreak=Math.max(0,(e.crystalStreak||0)-streakDecay);
      if(e.crystalStreak<=0){
        if(e.crystallized||e.moleculeId){
          if(typeof notePlay==='function') notePlay('dissolve');
        }
        e.crystallized=false; e.moleculeId=null;
      }
    }
  }
}

/* Fisión: alguna otra fuerza —impacto fotónico o shock ambiental— rompe la
   molécula cristalizada y dispersa sus miembros. */
function fissionMolecule(moleculeId, hue=15){
  const members=particles.filter(p=>p.moleculeId===moleculeId);
  if(members.length<2) return;
  const mx=members.reduce((s,p)=>s+p.x,0)/members.length;
  const my=members.reduce((s,p)=>s+p.y,0)/members.length;
  const mz=members.reduce((s,p)=>s+p.z,0)/members.length;
  const cool=FISSION_COOLDOWN;
  const kSp=FISSION_KICK_SPEED;
  const dJ=FISSION_KICK_J;
  for(const p of members){
    const dx=p.x-mx, dy=p.y-my, dz=p.z-mz;
    const d=Math.hypot(dx,dy,dz)+0.01;
    const kick=kSp*(0.75+Math.random()*0.55);
    p.vx+=(dx/d)*kick; p.vy+=(dy/d)*kick; p.vz+=(dz/d)*kick;
    p.crystallized=false; p.moleculeId=null; p.crystalStreak=0;
    p.fissionCooldownUntil=time+cool;
    excitedUntil.set(p.id,time+0.8);
    for(const other of members){
      if(other===p) continue;
      softLinks.delete(linkKey(p.id,other.id));
    }
  }
  spawnFlash(mx,my,mz,hue,1.9,'fission');
  impulse=Math.min(1,impulse+dJ);
  noteCascadeFission(1);
  if(typeof notePlay==='function') notePlay('fission');
}

function step(){
  const dt=0.018;
  time+=0.045;
  agarSteer(dt);
  agarEat();
  updateTugOfWar();
  computeFieldEnergy();
  updateThermalHysteresis();
  updateCascadeState();
  computeSystemEntropy();
  updateObserverEmit(0.045);
  
  const pl=getPlayer();
  if(pl){
    camFollow.x+=(pl.x-camFollow.x)*0.08;
    camFollow.y+=(pl.y-camFollow.y)*0.08;
    camFollow.z+=(pl.z-camFollow.z)*0.08;
  }
  if(!dragging) rotY+=0.0007; // deriva cinemática lenta: la escena nunca está del todo quieta

  for(let i=scheduledActions.length-1;i>=0;i--){
    if(time>=scheduledActions[i].at){ scheduledActions[i].fn(); scheduledActions.splice(i,1); }
  }

  // --- Predicción F, ANTES de que la física de este frame toque el campo ---
  const rN=rObs; // R_n: lo último que observamos realmente
  const eN=Math.min(1,Math.max(0, scale*0.7 + impulse*0.3));
  impulse*=0.94; // decae lento: la perturbación del jugador sigue contando unos frames
  const combinedPred=Math.PI*rN + PHI*eN + mantissaAlpha;
  const hypotheticalAlpha=combinedPred-Math.floor(combinedPred);
  const anticipatedShift=hypotheticalAlpha-mantissaAlpha;
  predictedNext=Math.min(1,Math.max(0, rN + anticipatedShift*PRED_SENS));
  nullPredicted=rN;

  if(pulseM){
    animPhase+=0.05;
    mantisa=0.7+1.0*(0.5+0.5*Math.sin(animPhase));
    document.getElementById('m').value=mantisa;
    /* valor de pulso: solo el slider */
  }

  /* ─── Aceleraciones deterministas F/m (Coulomb, LJ, fase, resortes) ─── */
  function computeAccelerations(){
    for(const e of particles){ e.ax=0; e.ay=0; e.az=0; }
    const assembleBias=scale<SCALE_MEAN ? (SCALE_MEAN-scale)/SCALE_MEAN : 0;
    for(let i=0;i<particles.length;i++){
      const e=particles[i];
      const invM=1/Math.max(0.2,e.mass);
      for(let j=i+1;j<particles.length;j++){
        const o=particles[j];
        const dx=o.x-e.x, dy=o.y-e.y, dz=o.z-e.z;
        const dist=Math.max(Math.hypot(dx,dy,dz),0.018);
        const invD=1/dist;
        const invMo=1/Math.max(0.2,o.mass);
        let fx=0, fy=0, fz=0; // fuerza sobre e (acción-reacción sobre o)
        const qq=(e.charge||0)*(o.charge||0);
        const disperseBias=scale>SCALE_MEAN?(scale-SCALE_MEAN)/(1-SCALE_MEAN):0;
        // Coulomb: mismo signo → repulsión; opuesto → atracción (más fuerte que la fase)
        if(e.charge&&o.charge&&dist<0.55){
          const kCoulomb=0.00055*mantisa*(0.7+0.3*hbar);
          let f=kCoulomb*qq/(dist*dist+0.015);
          // repulsión un poco más intensa que atracción (evita colapso de nubes e⁻/p⁺)
          if(qq>0) f*=1.35;
          f=Math.max(-0.022,Math.min(0.022,f));
          fx-=dx*invD*f; fy-=dy*invD*f; fz-=dz*invD*f;
        }
        // fases: atracción si en fase y umbral bajo; repulsión si fuera de fase o umbral alto
        if(dist<reach*1.25){
          const phaseDiff=Math.cos(e.phase-o.phase); // +1 alineadas, -1 opuestas
          let assembleBoost=1+assembleBias*1.6-disperseBias*1.1;
          // carga igual: la "atracción de fase" se atenúa mucho (Coulomb manda)
          if(qq>0) assembleBoost*=0.25;
          let force=(phaseDiff*0.00055*mantisa*assembleBoost)/(dist*dist+0.02);
          // en régimen de dispersión, sesgo neto a repeler
          if(disperseBias>0.2) force-=0.00035*mantisa*disperseBias/(dist*dist+0.03);
          force=Math.max(-0.01,Math.min(0.008,force));
          fx+=dx*invD*force; fy+=dy*invD*force; fz+=dz*invD*force;
        }
        const Lbond=dist<0.9?softLinks.get(linkKey(e.id,o.id)):null;
        const stuck=!!(Lbond&&(Lbond.stuck||(Lbond.alpha>0.25&&e.moleculeId&&e.moleculeId===o.moleculeId)));
        // repulsión de núcleo: suavizada si están adheridas (pueden acercarse)
        if(dist<0.04&&!stuck){
          const push=0.004*(0.04-dist)/0.04;
          fx-=dx*invD*push; fy-=dy*invD*push; fz-=dz*invD*push;
        } else if(dist<0.012&&stuck){
          // solo contacto duro mínimo entre unidades del cluster
          const push=0.002*(0.012-dist)/0.012;
          fx-=dx*invD*push; fy-=dy*invD*push; fz-=dz*invD*push;
        }
        // resorte de vínculo: adheridas → distancia corta + trayectoria compartida
        {
          /* Separación de vecindad: BOND_SEP_UNITS (2.5) × (ra+rb) entre centros.
             Lazos stuck usan el mismo suelo + resorte de vínculo. */
          const ra=bodyRadiusWorld(e), rb=bodyRadiusWorld(o);
          const sepIdeal=sepIdealWorld(e,o);
          const near=dist<Math.max(0.65, sepIdeal*2.0);
          if(near){
            const stretch=dist-sepIdeal;
            if(stretch<0){
              // repulsión de vecindad (todas las partículas)
              const kSep=0.055+0.02*assembleBias;
              const fSep=-kSep*stretch;
              fx+=dx*invD*fSep; fy+=dy*invD*fSep; fz+=dz*invD*fSep;
            }
          }
          if(dist<0.85&&Lbond&&Lbond.alpha>0.06){
            const ideal=sepIdeal; // mismo suelo: el lazo se ve entre cuerpos
            const stretch=dist-ideal;
            let kSpring=stuck
              ? (0.085*Lbond.alpha)
              : (0.012*Lbond.alpha*(e.crystallized&&o.crystallized?1.35:1));
            kSpring=Math.min(kSpring, stuck?0.14:0.035);
            const fSpring=-kSpring*stretch;
            fx+=dx*invD*fSpring; fy+=dy*invD*fSpring; fz+=dz*invD*fSpring;
            const rvx=e.vx-o.vx, rvy=e.vy-o.vy, rvz=e.vz-o.vz;
            const damp=stuck?0.05*Lbond.alpha:0.014*Lbond.alpha;
            fx-=rvx*damp; fy-=rvy*damp; fz-=rvz*damp;
            if(stuck){
              const mix=0.10*Lbond.alpha;
              const cvx=(e.vx+o.vx)*0.5, cvy=(e.vy+o.vy)*0.5, cvz=(e.vz+o.vz)*0.5;
              e.vx+=(cvx-e.vx)*mix; e.vy+=(cvy-e.vy)*mix; e.vz+=(cvz-e.vz)*mix;
              o.vx+=(cvx-o.vx)*mix; o.vy+=(cvy-o.vy)*mix; o.vz+=(cvz-o.vz)*mix;
            } else if(stretch<0.02){
              // cercanía sin stuck → fortalecer vínculo naciente (en vez de crecer tamaño)
              Lbond.target=Math.min(0.52, (Lbond.target||0)+0.008*assembleBias);
              Lbond.agency=(Lbond.agency||0)+0.02*assembleBias;
            }
          }
        }
        // LJ suave residual (atracción a media distancia); el suelo duro es sepIdeal
        if(dist<0.35&&dist>sepIdealWorld(e,o)*0.88){
          const sigmaVdW=0.055+0.004*(Math.sqrt(e.mass)+Math.sqrt(o.mass))*0.1;
          const epsVdW=0.00018*mantisa*(1+0.25*assembleBias);
          const invR=1/Math.max(dist,0.03);
          const sr=Math.min(sigmaVdW*invR,1.8);
          const sr2=sr*sr, sr6=sr2*sr2*sr2, sr12=sr6*sr6;
          let fMag=24*epsVdW*invR*(2*sr12-sr6);
          if(qq>0) fMag=Math.max(fMag,0)*1.1+Math.min(fMag,0)*0.15;
          fMag=Math.max(-0.008,Math.min(0.01,fMag));
          fx-=dx*invR*fMag; fy-=dy*invR*fMag; fz-=dz*invR*fMag;
        }
        e.ax+=fx*invM; e.ay+=fy*invM; e.az+=fz*invM;
        o.ax-=fx*invMo; o.ay-=fy*invMo; o.az-=fz*invMo;
      }
      // Aurion: atracción orbital hacia e⁻
      if(e.kind==='A'){
        for(const o of particles){
          if(o===e||o.kind!=='e') continue;
          const dx=e.x-o.x, dy=e.y-o.y, dz=e.z-o.z;
          const dist=Math.hypot(dx,dy,dz);
          if(dist<0.075&&dist>1e-6){
            const f=0.0018*mantisa;
            o.ax+=dx*f; o.ay+=dy*f; o.az+=dz*f;
          }
        }
      }
    }
    // potencial angular (triples stuck) → geometría 3D de coros
    applyAngularForces();
  }

  function randn(){
    let u=0,v=0;
    while(u===0) u=Math.random();
    while(v===0) v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  }

  function clampVel(e){
    const vmax=0.35;
    const sp=Math.hypot(e.vx,e.vy,e.vz);
    if(sp>vmax){ const s=vmax/sp; e.vx*=s; e.vy*=s; e.vz*=s; }
    if(!Number.isFinite(e.vx)) e.vx=0;
    if(!Number.isFinite(e.vy)) e.vy=0;
    if(!Number.isFinite(e.vz)) e.vz=0;
    if(!Number.isFinite(e.x)||!Number.isFinite(e.y)||!Number.isFinite(e.z)){
      e.x=0.5; e.y=0.5; e.z=0.5; e.vx=0; e.vy=0; e.vz=0; e.ax=0; e.ay=0; e.az=0;
    }
  }

  /* ─── Velocity Verlet + Langevin BAOAB ───
     B: v += (dt/2) a(x)
     A: x += (dt/2) v
     O: Ornstein–Uhlenbeck exacto  v ← c1 v + c2 √(kT/m) ξ
     A: x += (dt/2) v
     B: v += (dt/2) a(x')
     γ=0 y kT=0 → Verlet puro (NVE). Con γ>0 muestreás el canónico (NVT). */
  computeAccelerations();

  // B + A (media)
  for(const e of particles){
    e.phase+=e.freq*hbar*mantisa;
    e.sigma+=0.00015*hbar*hbar/Math.max(0.3,e.mass);
    e.vx+=0.5*dt*e.ax; e.vy+=0.5*dt*e.ay; e.vz+=0.5*dt*e.az;
    e.x+=0.5*dt*e.vx; e.y+=0.5*dt*e.vy; e.z+=0.5*dt*e.vz;
  }

  // O — termostato Langevin (fricción + ruido térmico)
  if(langevinOn && langevinGamma>1e-6){
    const g=langevinGamma;
    const c1=Math.exp(-g*dt);
    for(const e of particles){
      const c2=Math.sqrt(Math.max(0, langevinKT/Math.max(0.2,e.mass)*(1-c1*c1)));
      e.vx=c1*e.vx+c2*randn();
      e.vy=c1*e.vy+c2*randn();
      e.vz=c1*e.vz+c2*randn();
    }
  }

  // A (segunda media) + barreras / túnel
  for(const e of particles){
    let nx=e.x+0.5*dt*e.vx, ny=e.y+0.5*dt*e.vy, nz=e.z+0.5*dt*e.vz;
    if(inBarrier(nx,ny,nz)){
      const tunnelP=Math.exp(-2.5*e.mass/hbar)*0.15*mantisa;
      if(Math.random()>tunnelP){
        if(inBarrier(nx,e.y,e.z)) e.vx*=-0.85;
        if(inBarrier(e.x,ny,e.z)) e.vy*=-0.85;
        if(inBarrier(e.x,e.y,nz)) e.vz*=-0.85;
        nx=e.x+0.5*dt*e.vx; ny=e.y+0.5*dt*e.vy; nz=e.z+0.5*dt*e.vz;
      }
    }
    const wasBlocked=inBarrier(e.x+Math.sign(e.vx||0.01)*0.04,e.y,e.z);
    e.x=nx; e.y=ny; e.z=nz;
    if(wasBlocked && !inBarrier(e.x,e.y,e.z) && e.vx>0.01){
      spawnFlash(e.x,e.y,e.z,160,1,'tunnel');
      excitedUntil.set(e.id,time+0.6);
      if(time-lastTunnelLog>0.8){ log('Cruza el Velo · '+kindMeta[e.kind].name+' #'+e.id); lastTunnelLog=time; }
    }
    reflectOffDodecahedron(e);
  }

  // colisiones elásticas (impulsos instantáneos sobre v)
  for(const p of particles) p._cbrt=Math.cbrt(Math.max(0.2,p.mass)); // evita recalcular cbrt por cada par
  for(let i=0;i<particles.length;i++){
    const e=particles[i];
    for(let j=i+1;j<particles.length;j++){
      const o=particles[j];
      const dx=o.x-e.x, dy=o.y-e.y, dz=o.z-e.z;
      const dist=Math.hypot(dx,dy,dz)+1e-9;
      const rColl=0.022+0.006*(e._cbrt+o._cbrt);
      if(dist>=rColl) continue;
      const nx=dx/dist, ny=dy/dist, nz=dz/dist;
      const vn=(e.vx-o.vx)*nx+(e.vy-o.vy)*ny+(e.vz-o.vz)*nz;
      if(vn>=0) continue;
      const m1=Math.max(0.2,e.mass), m2=Math.max(0.2,o.mass);
      let jImp=-(1+0.9)*vn/(1/m1+1/m2);
      jImp=Math.max(-0.08,Math.min(0.08,jImp));
      e.vx+=(jImp/m1)*nx; e.vy+=(jImp/m1)*ny; e.vz+=(jImp/m1)*nz;
      o.vx-=(jImp/m2)*nx; o.vy-=(jImp/m2)*ny; o.vz-=(jImp/m2)*nz;
      const push=Math.min((rColl-dist)*0.5,0.02);
      e.x-=nx*push*(m2/(m1+m2)); e.y-=ny*push*(m2/(m1+m2)); e.z-=nz*push*(m2/(m1+m2));
      o.x+=nx*push*(m1/(m1+m2)); o.y+=ny*push*(m1/(m1+m2)); o.z+=nz*push*(m1/(m1+m2));
      if(Math.random()<0.12){
        spawnFlash((e.x+o.x)/2,(e.y+o.y)/2,(e.z+o.z)/2,200,0.45,'collision');
        emitDust((e.x+o.x)/2,(e.y+o.y)/2,(e.z+o.z)/2,1,0.01);
      }
    }
  }

  // B final — recompute a(x') y completar media-kick
  computeAccelerations();
  const byIdReact=new Map();
  for(const p of particles) byIdReact.set(p.id,p);
  for(const e of particles){
    e.vx+=0.5*dt*e.ax; e.vy+=0.5*dt*e.ay; e.vz+=0.5*dt*e.az;
    clampVel(e);
  }
  // SHAKE/RATTLE light: stuck a distancia ideal 2.5
  constrainStuckBonds();
  for(const e of particles){
    // correlaciones / reacciones (no integradas)
    if(e.entangledWith!=null){
      const partner=byIdReact.get(e.entangledWith);
      if(partner) e.phase+=(partner.phase-e.phase)*0.02;
    }
    if(e.kind==='A'){
      for(const o of particles){
        if(o===e||o.kind!=='e') continue;
        const dist=Math.hypot(o.x-e.x,o.y-e.y,o.z-e.z);
        if(dist<0.075){
          const key='cap:'+linkKey(e.id,o.id);
          if(time-(reactionCooldown.get(key)||-99)>1.4){
            reactionCooldown.set(key,time);
            excitedUntil.set(e.id,time+0.7); excitedUntil.set(o.id,time+0.7);
            spawnFlash(e.x,e.y,e.z,42,1.25,'capture');
            log('Aurion #'+e.id+' atrae Almita #'+o.id);
            if(typeof notePlay==='function') notePlay('capture');
          }
        }
      }
    }
    if(e.kind==='Ψ'){
      for(const o of particles){
        if(o===e||(o.kind!=='Ψ'&&o.kind!=='e')) continue;
        const dist=Math.hypot(o.x-e.x,o.y-e.y,o.z-e.z);
        if(dist<0.05){
          const key='col:'+linkKey(e.id,o.id);
          if(time-(reactionCooldown.get(key)||-99)>1.4){
            reactionCooldown.set(key,time);
            excitedUntil.set(e.id,time+0.7); excitedUntil.set(o.id,time+0.7);
            e.sigma=Math.max(0.012,e.sigma*0.22);
            spawnFlash((e.x+o.x)/2,(e.y+o.y)/2,(e.z+o.z)/2,168,1.35,'collapse');
            log('Ondina #'+e.id+' se pliega en el éter');
            if(typeof notePlay==='function') notePlay('collapse');
          }
        }
      }
    }
    if(e.kind==='γ'){
      for(const o of particles){
        if(o===e||!o.crystallized||!o.moleculeId) continue;
        const dist=Math.hypot(o.x-e.x,o.y-e.y,o.z-e.z);
        if(dist<0.10){ fissionMolecule(o.moleculeId,15); break; }
      }
    }

    const spd=Math.hypot(e.vx,e.vy,e.vz);
    if(!trails.has(e.id)) trails.set(e.id,[]);
    const tr=trails.get(e.id);
    tr.push({x:e.x,y:e.y,z:e.z,life:1,spd});
    // cap de estela adaptativo: con muchas partículas activas, menos historial por una (rendimiento)
    const trailCap=particles.length>90?14:particles.length>50?22:36;
    if(tr.length>trailCap) tr.shift();
    for(let t=0;t<tr.length;t++) tr[t].life-=0.032;
    while(tr.length&&tr[0].life<=0) tr.shift();
    if(spd>0.008 && Math.random()<(particles.length>90?0.16:0.35)) emitDust(e.x,e.y,e.z,1,0.008);

    const ix=Math.max(0,Math.min(IW-1,(e.x*IW)|0));
    const iy=Math.max(0,Math.min(IH-1,(e.y*IH)|0));
    interf[iy*IW+ix]+=Math.cos(e.phase)*Math.exp(-e.sigma*8)*0.35*mantisa;
  }

  // --- Agencia / adhesión (fundamentales: no se dividen ni cambian de tipo) ---
  {
    const fagoOpen=scale<SCALE_MEAN+0.08;
    const activeKeys=new Set();
    if(fagoOpen){
      const snapshot=[...particles];
      for(const e of snapshot){
        if(!particles.includes(e)) continue;
        // cualquier tipo puede agenciarse; los "fago" solo inician más fácil el dwell
        const initiator=kindMeta[e.kind]?.fago?1.25:1;
        e.vibratePhase=(e.vibratePhase||0)+0.06*initiator;
        for(const o of snapshot){
          if(o===e||!particles.includes(o)) continue;
          if(e.moleculeId&&o.moleculeId===e.moleculeId) continue;
          const lin=sameLineage(e,o);
          const cq=(o.charge||0)*(e.charge||0);
          const chargeOk=cq<=0||lin;
          if(!chargeOk&&!lin) continue;
          const dist=Math.hypot(o.x-e.x,o.y-e.y,o.z-e.z);
          if(dist>FAGO_RADIUS) continue;
          const key='fago:'+linkKey(e.id,o.id);
          activeKeys.add(key);
          const dwellGain=0.045*initiator*(lin?1.4:1)*(0.75+(SCALE_MEAN-Math.min(scale,SCALE_MEAN))/SCALE_MEAN*0.5);
          fagoDwell.set(key,(fagoDwell.get(key)||0)+dwellGain);
          if(dist>0.02){
            const pull=0.0018*(1-dist/FAGO_RADIUS);
            e.vx+=(o.x-e.x)*pull*0.5; e.vy+=(o.y-e.y)*pull*0.5; e.vz+=(o.z-e.z)*pull*0.5;
            o.vx+=(e.x-o.x)*pull*0.5; o.vy+=(e.y-o.y)*pull*0.5; o.vz+=(e.z-o.z)*pull*0.5;
          }
          if((fagoDwell.get(key)||0)<FAGO_DWELL) continue;
          if(time-(reactionCooldown.get(key)||-99)<FAGO_COOLDOWN) continue;
          reactionCooldown.set(key,time);
          fagoDwell.delete(key);
          adhereParticles(e,o,'fagocitación-adhesiva');
          if(typeof notePlay==='function') notePlay('fago');
          break;
        }
      }
    }
    for(const k of [...fagoDwell.keys()]){
      if(!activeKeys.has(k)) fagoDwell.set(k,Math.max(0,(fagoDwell.get(k)||0)-0.1));
      if((fagoDwell.get(k)||0)<=0) fagoDwell.delete(k);
    }
  }

  // decay interference residue
  for(let i=0;i<interf.length;i++) interf[i]*=0.965;
  // decay flashes
  for(let i=tunnelFlashes.length-1;i>=0;i--){
    tunnelFlashes[i].life-=0.03;
    if(tunnelFlashes[i].life<=0) tunnelFlashes.splice(i,1);
  }
  for(let i=faceWaves.length-1;i>=0;i--){
    faceWaves[i].life-=0.04;
    if(faceWaves[i].life<=0) faceWaves.splice(i,1);
  }
  for(let i=cubeHits.length-1;i>=0;i--){
    cubeHits[i].life-=0.035;
    if(cubeHits[i].life<=0) cubeHits.splice(i,1);
  }
  for(let i=dustMotes.length-1;i>=0;i--){
    const d=dustMotes[i];
    d.x+=d.vx; d.y+=d.vy; d.z+=d.vz;
    d.vx*=0.97; d.vy*=0.97; d.vz*=0.97;
    d.life-=0.018;
    if(d.life<=0) dustMotes.splice(i,1);
  }
  // log periódico de estadísticas de doble rendija
  if(doubleSlitStats.active && time-doubleSlitStats.lastLog>2.5 && doubleSlitStats.rearHits>0){
    doubleSlitStats.lastLog=time;
    const peak=Math.max(...doubleSlitStats.bins);
    const peaks=doubleSlitStats.bins.filter(v=>v>peak*0.55).length;
    log('Dos Umbrales · ecos tras el velo: '+doubleSlitStats.rearHits+' · picos≈'+peaks);
  }

  updateSoftLinks();
  {
    const byId1=new Map();
    for(const p of particles) byId1.set(p.id,p);
    updateSynthesis(byId1); // nivel 1: subpartículas → átomo
  }
  {
    const byId2=new Map(); // reconstruido: la síntesis puede haber mutado particles
    for(const p of particles) byId2.set(p.id,p);
    updateMolecules(byId2); // nivel 2: átomos → molécula
  }
  // fisión por shock ambiental: un pico fuerte de perturbación (no solo el fotón) también rompe cristales
  {
    /* Cascada ambiental = modelo Monte Carlo: P por mole si impulseEff > umbral */
    const impulseEff=getImpulseEff();
    if(impulseEff>FISSION_IMPULSE){
      const molIds=[...new Set(particles.filter(p=>p.crystallized&&p.moleculeId).map(p=>p.moleculeId))];
      for(const mid of molIds){
        if(Math.random()<CASCADE_P) fissionMolecule(mid,8);
      }
    }
  }

  // --- R_n+1^obs = G(...): lo que la física realmente produjo este frame ---
  const rObsNext=Math.min(1, meanAbsInterf()*6);
  const errF=Math.abs(rObsNext-predictedNext);
  const errN=Math.abs(rObsNext-nullPredicted);
  errHistoryF.push(errF); errHistoryNull.push(errN);
  if(errHistoryF.length>METRICS_WINDOW){errHistoryF.shift(); errHistoryNull.shift();}
  rObsHistoryForEps.push(rObsNext);
  if(rObsHistoryForEps.length>60) rObsHistoryForEps.shift();
  currentEps=adaptiveEpsilon();
  const hitsF=errHistoryF.filter(e=>e<currentEps).length;
  const hitsN=errHistoryNull.filter(e=>e<currentEps).length;
  precisionF=errHistoryF.length?(hitsF/errHistoryF.length)*100:0;
  precisionNull=errHistoryNull.length?(hitsN/errHistoryNull.length)*100:0;
  mejora=precisionF-precisionNull;
  maeF=errHistoryF.length?errHistoryF.reduce((a,b)=>a+b,0)/errHistoryF.length:0;
  maeNull=errHistoryNull.length?errHistoryNull.reduce((a,b)=>a+b,0)/errHistoryNull.length:0;
  metricsConclusive=errHistoryF.length>=80;
  rObs=rObsNext;

  // --- Actualizar mantissa α_n = φ + Δα_n a partir del estado observado ---
  const combined=Math.PI*rObsNext + PHI*eN + mantissaAlpha;
  const newAlpha=combined-Math.floor(combined);
  const newDelta=newAlpha-PHI_FRAC;
  const magPrev=Math.abs(mantissaDeltaAlpha), magNew=Math.abs(newDelta);
  deltaAlphaHistory.push(newDelta);
  if(deltaAlphaHistory.length>180) deltaAlphaHistory.shift();
  mantissaStateLabel=classifyMantissa(newDelta, magNew-magPrev);
  mantissaAlpha=newAlpha;
  mantissaDeltaAlpha=newDelta;

  // metrics
  let meanSig=0;
  for(const p of particles) meanSig+=p.sigma;
  meanSig=particles.length?meanSig/particles.length:0;
  historyD.push(particles.length);
  historyS.push(meanSig);
  historyL.push(softLinks.size);
  if(historyD.length>HIST){historyD.shift();historyS.shift();historyL.shift()}
  updateScaleExperiment();
}

function project(nx,ny,nz,cx,cy,s3){
  let x1=nx*Math.cos(rotY)-nz*Math.sin(rotY);
  let z1=nx*Math.sin(rotY)+nz*Math.cos(rotY);
  let y2=ny*Math.cos(rotX)-z1*Math.sin(rotX);
  let z2=ny*Math.sin(rotX)+z1*Math.cos(rotX);
  const persp=1/(1.55-z2*0.55);
  return {sx:cx+x1*s3*persp, sy:cy+y2*s3*persp, z:z2, p:persp};
}
/** Pantalla → mundo: plano medio del volumen (coincide con lo que se ve al clicar). */
function screenToWorld(clientX, clientY){
  const r=canvas.getBoundingClientRect();
  const sx=clientX-r.left, sy=clientY-r.top;
  const cx=W/2, cy=H/2;
  const s3=Math.min(W,H)*0.28*(1+Math.sin(time*0.1)*0.04)*zoom;
  const persp=1/1.55; // plano z2≈0
  const x1=(sx-cx)/(s3*persp);
  const y2=(sy-cy)/(s3*persp);
  const cosX=Math.cos(rotX), sinX=Math.sin(rotX);
  const cosY=Math.cos(rotY), sinY=Math.sin(rotY);
  const ny=y2*cosX;
  const z1=-y2*sinX;
  const nx=x1*cosY+z1*sinY;
  const nz=-x1*sinY+z1*cosY;
  const clamp=v=>Math.max(WORLD_MIN+0.04,Math.min(WORLD_MAX-0.04,v));
  return {x:clamp(nx+0.5), y:clamp(ny+0.5), z:clamp(nz+0.5)};
}


function drawObserverCone(cx,cy,s3){
  const oe=observerEmit;
  if(!oe || (oe.strength*oe.life<0.04 && oe.kind==='hito' && impulse<0.08)){
    // cono tenue siempre desde hito (omnipresión de fondo)
  }
  const pr=project(oe.x-0.5, oe.y-0.5, oe.z-0.5, cx, cy, s3);
  const life=Math.max(0.15, oe.life);
  const str=Math.max(0.12, oe.strength);
  const baseR=(55+90*str)*pr.p*life;
  const ie=typeof getImpulseEff==='function'?getImpulseEff():0;
  const pulse=0.85+0.15*Math.sin(time*2.2+oe.age);

  // anillos del cono de fuga (perspectiva del punto emisor)
  ctx.save();
  for(let i=3;i>=0;i--){
    const t=i/3;
    const R=baseR*(0.35+0.65*t);
    const a=(0.14-0.03*i)*str*life*pulse*(oe.kind==='drag'?1.1:1);
    const hue=oe.kind==='spawn'?200:oe.kind==='drag'?35:280;
    ctx.strokeStyle=hsl(hue, 70, 72, a);
    ctx.lineWidth=(1.2-0.15*i)*pr.p;
    ctx.beginPath(); ctx.arc(pr.sx, pr.sy, R, 0, Math.PI*2); ctx.stroke();
  }
  // núcleo del emisor
  const g=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,baseR*0.55);
  const a0=0.22*str*life*pulse;
  g.addColorStop(0, hsl(oe.kind==='drag'?42:195, 90, 80, a0));
  g.addColorStop(0.45, hsl(210, 70, 60, a0*0.35));
  g.addColorStop(1, 'rgba(20,40,80,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(pr.sx,pr.sy,baseR*0.55,0,Math.PI*2); ctx.fill();

  // rayos tenues (fuga)
  if(str*life>0.2){
    const n=6;
    for(let i=0;i<n;i++){
      const ang=time*0.35+i*(Math.PI*2/n)+oe.age*0.2;
      const R2=baseR*1.05;
      ctx.strokeStyle=hsl(190, 60, 70, 0.06*str*life);
      ctx.lineWidth=0.8*pr.p;
      ctx.beginPath();
      ctx.moveTo(pr.sx, pr.sy);
      ctx.lineTo(pr.sx+Math.cos(ang)*R2, pr.sy+Math.sin(ang)*R2);
      ctx.stroke();
    }
  }
  // marca de J_eff en el borde si zona caliente
  if(ie>0.35){
    ctx.strokeStyle=hsl(15, 90, 60, 0.12+0.2*Math.min(1,(ie-0.35)/0.3));
    ctx.lineWidth=1.4*pr.p;
    ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,baseR*1.12,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawFugaRetencionHUD(ctx, W, H){
  const fr=computeFugaRetencion();
  const pad=12;
  const bw=Math.min(152, W*0.26);
  const x=W-pad-bw, y=H-pad-52;
  ctx.save();
  ctx.fillStyle='rgba(8,14,28,0.55)';
  ctx.strokeStyle='rgba(140,170,210,0.22)';
  ctx.lineWidth=1;
  if(typeof roundRect==='function'){ roundRect(ctx,x,y,bw,48,8); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(x,y,bw,48); }
  ctx.font='600 9px Outfit,sans-serif';
  ctx.fillStyle='rgba(160,190,220,0.85)';
  ctx.fillText('observador · emisor', x+8, y+12);
  ctx.font='500 9px Outfit,sans-serif';
  ctx.fillStyle='rgba(120,200,230,0.9)';
  ctx.fillText('fuga', x+8, y+26);
  ctx.fillStyle='rgba(220,180,120,0.9)';
  ctx.fillText('retención', x+8, y+40);
  // barras
  const bx=x+62, bw2=bw-72, bh=5;
  ctx.fillStyle='rgba(40,60,90,0.8)';
  ctx.fillRect(bx, y+21, bw2, bh);
  ctx.fillRect(bx, y+35, bw2, bh);
  ctx.fillStyle='rgba(80,190,230,0.85)';
  ctx.fillRect(bx, y+21, bw2*fr.fuga, bh);
  ctx.fillStyle='rgba(230,170,90,0.85)';
  ctx.fillRect(bx, y+35, bw2*fr.retencion, bh);
  ctx.restore();
}


function drawField(){
  if(!W) return;
  // cielo cotton-candy / pin-up
  const sky=ctx.createLinearGradient(0,0,W,H);
  // fondo azul muy oscuro
  sky.addColorStop(0,'#0a1228'); sky.addColorStop(0.45,'#060a18'); sky.addColorStop(1,'#04060e');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const tw=0.4+0.5*Math.sin(time*1.2+s.ph);
    ctx.fillStyle=`rgba(200,220,255,${(0.15+tw*0.45).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r*1.1, 0, Math.PI*2); ctx.fill();
  }
  const cx=W/2, cy=H/2;
  const s3=Math.min(W,H)*0.28*(1+Math.sin(time*0.1)*0.04)*zoom;

  // capas de escala R(r) y r* alrededor del hito
  drawScaleRings(cx,cy,s3);
  // cono de influencia del observador-emisor (fuga)
  drawObserverCone(cx,cy,s3);
  // el atractor del tirón no se materializa: solo se lee en la dinámica de los núcleos

  // caja: dodecaedro + cubo — aristas en trazos tenues
  ctx.save();
  ctx.setLineDash([3.5, 5.5]);
  ctx.lineCap='round';
  {
    const dpts=DODECA.verts.map(v=>project(v[0],v[1],v[2],cx,cy,s3));
    for(const [i,j] of DODECA.edges){
      const a=dpts[i], b=dpts[j];
      const avgZ=(a.z+b.z)/2;
      const al=Math.max(0.08,Math.min(0.22,0.12+avgZ*0.06));
      ctx.strokeStyle=`rgba(190,200,215,${al.toFixed(3)})`;
      ctx.lineWidth=0.85;
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    }
  }
  {
    const cubeVerts=[
      [-0.96,-0.96,-0.96],[0.96,-0.96,-0.96],[0.96,0.96,-0.96],[-0.96,0.96,-0.96],
      [-0.96,-0.96,0.96],[0.96,-0.96,0.96],[0.96,0.96,0.96],[-0.96,0.96,0.96]
    ];
    const cpts=cubeVerts.map(v=>project(v[0],v[1],v[2],cx,cy,s3));
    const edges=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    for(const [i,j] of edges){
      const a=cpts[i], b=cpts[j];
      const avgZ=(a.z+b.z)/2;
      const al=Math.max(0.07,Math.min(0.20,0.11+avgZ*0.05));
      ctx.strokeStyle=`rgba(185,195,210,${al.toFixed(3)})`;
      ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.restore();
  // ondas grises efímeras al atravesar caras del dodecaedro
  for(const f of faceWaves){
    const pr=project(f.x-0.5,f.y-0.5,f.z-0.5,cx,cy,s3);
    const R=14*pr.p*f.life;
    ctx.strokeStyle=`rgba(160,170,185,${(0.35*f.life).toFixed(3)})`;
    ctx.lineWidth=1.1*pr.p;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,R,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=`rgba(140,150,165,${(0.18*f.life).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,R*1.35,0,Math.PI*2); ctx.stroke();
  }
  // reacciones animadas al contacto con límites fantasma
  for(const h of cubeHits){
    const pr=project(h.x-0.5,h.y-0.5,h.z-0.5,cx,cy,s3);
    const R=10*pr.p*(0.4+0.6*h.life);
    const g=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,R);
    g.addColorStop(0,`rgba(148,163,184,${(0.45*h.life).toFixed(3)})`);
    g.addColorStop(1,`rgba(100,116,139,0)`);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=`rgba(203,213,225,${(0.4*h.life).toFixed(3)})`;
    ctx.lineWidth=1.2*pr.p;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,R*1.15,0,Math.PI*2); ctx.stroke();
  }
  // estela de polvo ambiental (más intensa)
  for(const d of dustMotes){
    const pr=project(d.x-0.5,d.y-0.5,d.z-0.5,cx,cy,s3);
    const al=Math.min(0.55,d.life*0.5);
    ctx.fillStyle=`rgba(180,190,210,${al.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,d.r*pr.p,0,Math.PI*2); ctx.fill();
  }

  // interference residue (subtle fringes on mid plane projection)
  {
    let maxA=1e-6;
    for(let i=0;i<interf.length;i++) maxA=Math.max(maxA,Math.abs(interf[i]));
    if(maxA>0.02){
      for(let j=0;j<IH;j+=1){
        for(let i=0;i<IW;i+=1){
          const v=interf[j*IW+i]/maxA;
          if(Math.abs(v)<0.12) continue;
          const wx=i/IW, wy=j/IH, wz=0.5;
          const pr=project(wx-0.5,wy-0.5,wz-0.5,cx,cy,s3);
          const alpha=Math.min(0.32, Math.abs(v)*0.28);
          ctx.fillStyle=v>0?hsl(190,90,60,alpha):hsl(280,80,55,alpha);
          ctx.beginPath();
          ctx.arc(pr.sx,pr.sy,2.8*pr.p,0,Math.PI*2);
          ctx.fill();
        }
      }
    }
  }

  // tunnel & reaction flashes — anillo expansivo + chispas radiales en eventos grandes
  for(const f of tunnelFlashes){
    const pr=project(f.x-0.5,f.y-0.5,f.z-0.5,cx,cy,s3);
    const scl=f.scale||1;
    const hue=f.hue??160;
    const R=22*pr.p*f.life*scl;
    const g=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,R);
    g.addColorStop(0,hsl(hue,100,75,0.75*f.life));
    g.addColorStop(0.5,hsl(hue,95,60,0.35*f.life));
    g.addColorStop(1,hsl(hue,90,50,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=hsl(hue,100,82,0.5*f.life);
    ctx.lineWidth=1.4*pr.p;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,R*1.18,0,Math.PI*2); ctx.stroke();
    if(scl>1.15){
      const rays=7;
      for(let r=0;r<rays;r++){
        const ang=(r/rays)*Math.PI*2+f.life*2.4;
        ctx.strokeStyle=hsl(hue,100,85,0.42*f.life);
        ctx.lineWidth=1*pr.p;
        ctx.beginPath();
        ctx.moveTo(pr.sx+Math.cos(ang)*R*0.65, pr.sy+Math.sin(ang)*R*0.65);
        ctx.lineTo(pr.sx+Math.cos(ang)*R*1.5,  pr.sy+Math.sin(ang)*R*1.5);
        ctx.stroke();
      }
    }
  }

  // barriers — se dibuja el plano real y-z del muro (grosor en x), así las
  // aperturas de la doble rendija y el muro sólido del túnel se ven correctos
  for(const b of barriers){
    const midX=(b.x0+b.x1)/2;
    const corners=[
      [midX,b.y0,b.z0],[midX,b.y1,b.z0],[midX,b.y1,b.z1],[midX,b.y0,b.z1]
    ];
    const pts=corners.map(([x,y,z])=>project(x-0.5,y-0.5,z-0.5,cx,cy,s3));
    const pulse=0.5+0.5*Math.sin(time*1.6+b.y0*11);
    ctx.fillStyle=`rgba(148,163,184,${(0.055+0.05*pulse).toFixed(3)})`;
    ctx.strokeStyle=`rgba(103,232,249,${(0.28+0.24*pulse).toFixed(3)})`;
    ctx.lineWidth=1.1;
    ctx.beginPath();
    pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p.sx,p.sy);else ctx.lineTo(p.sx,p.sy)});
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // soft links
  const entProj=new Map();
  for(const e of particles){
    entProj.set(e.id,{...project(e.x-0.5,e.y-0.5,e.z-0.5,cx,cy,s3), e});
  }
  const links=[...softLinks.values()].sort((a,b)=>{
    const pa=entProj.get(a.a), pb=entProj.get(a.b);
    const qa=entProj.get(b.a), qb=entProj.get(b.b);
    const za=pa&&pb?(pa.z+pb.z)/2:-9, zb=qa&&qb?(qa.z+qb.z)/2:-9;
    return za-zb;
  });
  // which particles are linked
  const linkedIds=new Set();
  for(const L of softLinks.values()){
    if(L.alpha>0.04){ linkedIds.add(L.a); linkedIds.add(L.b); }
  }

  /* ── Red relacional (spin-network look): malla tenue + núcleo + geometría ── */
  // Lazos débiles de proximidad (quantum links potenciales) — no solo stuck
  {
    const n=particles.length;
    const maxWeak=n>60?80:n>30?140:220;
    let drawn=0;
    const reachNet=Math.max(0.12, (typeof reach==='number'?reach:0.28)*0.85);
    for(let i=0;i<n && drawn<maxWeak;i++){
      const a=particles[i];
      const pa=entProj.get(a.id); if(!pa) continue;
      for(let j=i+1;j<n && drawn<maxWeak;j++){
        const b=particles[j];
        const d=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
        if(d>reachNet||d<1e-6) continue;
        // omitir si ya hay softLink visible
        const k=a.id<b.id?a.id+'_'+b.id:b.id+'_'+a.id;
        // linkKey may differ — skip heavy; draw weak always if far from strong alpha
        const pb=entProj.get(b.id); if(!pb) continue;
        const t=1-d/reachNet;
        const al=0.028+0.07*t*t;
        const hueMix=((a.hue||200)+(b.hue||200))/2;
        ctx.strokeStyle=hsl(190+hueMix*0.05, 70, 70, al);
        ctx.lineWidth=0.55*Math.max(0.4,(pa.p+pb.p)/2);
        ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
        drawn++;
      }
    }
  }

  // Envolvente + radios al baricentro por coro (spatial geometry)
  {
    const groups=new Map();
    for(const e of particles){
      if(!e.moleculeId) continue;
      if(!groups.has(e.moleculeId)) groups.set(e.moleculeId,[]);
      groups.get(e.moleculeId).push(e);
    }
    for(const members of groups.values()){
      if(members.length<2) continue;
      const pts=[];
      let cx=0,cy=0,w=0;
      for(const e of members){
        const pr=entProj.get(e.id); if(!pr) continue;
        pts.push(pr);
        const m=e.mass||1;
        cx+=pr.sx*m; cy+=pr.sy*m; w+=m;
      }
      if(pts.length<2||w<1e-6) continue;
      cx/=w; cy/=w;
      // radios tenues nodo → centro del coro
      for(const pr of pts){
        ctx.strokeStyle='rgba(160,200,255,0.06)';
        ctx.lineWidth=0.6;
        ctx.beginPath(); ctx.moveTo(pr.sx,pr.sy); ctx.lineTo(cx,cy); ctx.stroke();
      }
      // envolvente circular aproximada
      let R=0;
      for(const pr of pts) R=Math.max(R, Math.hypot(pr.sx-cx,pr.sy-cy));
      R+=8;
      ctx.strokeStyle='rgba(140,190,255,0.14)';
      ctx.lineWidth=1.1;
      ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='rgba(180,210,255,0.08)';
      ctx.beginPath(); ctx.arc(cx,cy,R*1.12,0,Math.PI*2); ctx.stroke();
      // núcleo del coro
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.45);
      g.addColorStop(0,'rgba(200,220,255,0.07)');
      g.addColorStop(1,'rgba(100,150,220,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(cx,cy,R*0.45,0,Math.PI*2); ctx.fill();
    }
  }

  // Atractor emergente del tirón: campo gravitatorio simbólico
  if(tugState.active&&tugState.attractor){
    const att=tugState.attractor;
    const pr=project(att.x-0.5,att.y-0.5,att.z-0.5,cx,cy,s3);
    const g=ctx.createRadialGradient(pr.sx,pr.sy,0,pr.sx,pr.sy,48*pr.p);
    g.addColorStop(0,'rgba(180,160,255,0.10)');
    g.addColorStop(0.5,'rgba(120,140,220,0.04)');
    g.addColorStop(1,'rgba(80,100,180,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(pr.sx,pr.sy,48*pr.p,0,Math.PI*2); ctx.fill();
  }

  function bodyRadPx(e, pr){
    // tamaño en pantalla ∝ 1/masa (Ondina = RAD_PX_UNIT)
    return RAD_PX_UNIT*massSizeScale(e.kind)*(pr.p||1);
  }
  for(const L of links){
    const pa=entProj.get(L.a), pb=entProj.get(L.b);
    if(!pa||!pb||L.alpha<0.01) continue;
    const sameCrystal=pa.e.crystallized && pb.e.crystallized && pa.e.moleculeId && pa.e.moleculeId===pb.e.moleculeId;
    const stuck=!!L.stuck;
    const pulse=0.9+0.1*Math.sin(time*2.5+L.a);
    const depthS=Math.max(0.55, Math.min(1.35, 0.75+((pa.z+pb.z)/2)*0.4));
    const al=Math.min(1, L.alpha*(stuck?1.45:1.0));
    // Radios en pantalla: el lazo une superficies, no centros (como la red de la figura)
    const ra=bodyRadPx(pa.e, pa), rb=bodyRadPx(pb.e, pb);
    const ddx=pb.sx-pa.sx, ddy=pb.sy-pa.sy;
    const len=Math.hypot(ddx,ddy)||1;
    if(len<ra+rb+0.5) continue; // demasiado solapados: no dibujar barra
    const ux=ddx/len, uy=ddy/len;
    const x1=pa.sx+ux*ra, y1=pa.sy+uy*ra;
    const x2=pb.sx-ux*rb, y2=pb.sy-uy*rb;
    // glow de campo del lazo (spin-network)
    if(stuck||L.alpha>0.18){
      ctx.strokeStyle=sameCrystal
        ? `rgba(180,210,255,${(0.08*al*pulse).toFixed(3)})`
        : `rgba(140,200,255,${(0.06*al*pulse).toFixed(3)})`;
      ctx.lineWidth=(stuck?5.5:3.2)*depthS;
      ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    // barra geométrica principal
    let stroke;
    if(sameCrystal) stroke=`rgba(200,230,255,${(0.75*al*pulse).toFixed(3)})`;
    else if(L.lineage) stroke=`rgba(255,160,200,${(0.7*al*pulse).toFixed(3)})`;
    else {
      const hh=((pa.e.hue+pb.e.hue)/2)|0;
      stroke=hsl(hh, 75, 78, 0.65*al*pulse);
    }
    ctx.strokeStyle=stroke;
    ctx.lineCap='round';
    ctx.lineWidth=(stuck?2.4:1.1+L.alpha*1.6)*depthS;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // núcleo del enlace (punto medio luminoso)
    if(stuck){
      const mx=(x1+x2)*0.5, my=(y1+y2)*0.5;
      const rg=ctx.createRadialGradient(mx,my,0,mx,my,4*depthS);
      rg.addColorStop(0,`rgba(230,245,255,${(0.45*al).toFixed(3)})`);
      rg.addColorStop(1,`rgba(150,190,255,0)`);
      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.arc(mx,my,4*depthS,0,Math.PI*2); ctx.fill();
    }
  }

  // trails (suaves, no compiten con los bonds)
  const trailStride=particles.length>90?3:particles.length>50?2:1;
  for(const e of particles){
    const tr=trails.get(e.id);
    if(!tr||tr.length<2) continue;
    for(let i=trailStride;i<tr.length;i+=trailStride){
      const a=tr[i-trailStride], b=tr[i];
      const pa=project(a.x-0.5,a.y-0.5,a.z-0.5,cx,cy,s3);
      const pb=project(b.x-0.5,b.y-0.5,b.z-0.5,cx,cy,s3);
      const al=Math.min(a.life,b.life)*0.28;
      const taper=i/tr.length;
      ctx.strokeStyle=hsl(e.hue,80,70,Math.min(0.35,al));
      ctx.lineWidth=(0.6+1.2*taper)*pb.p;
      ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
    }
  }

  // ── Partículas: simbología molecular (esferas + orbitales / terminales) ──
  const order=[...particles].sort((a,b)=>{
    const pa=entProj.get(a.id), pb=entProj.get(b.id);
    return (pa?.z??0)-(pb?.z??0);
  });
  const lodHigh=particles.length>90, lodMed=particles.length>50;

  function molSphere(x,y,r,hue,sat,lit,a){
    const g=ctx.createRadialGradient(x-r*0.28,y-r*0.32,r*0.05,x,y,r);
    g.addColorStop(0,hsl(hue,Math.min(100,sat+15),Math.min(95,lit+22),a));
    g.addColorStop(0.45,hsl(hue,sat,lit,a*0.95));
    g.addColorStop(1,hsl(hue,sat*0.85,Math.max(18,lit-28),a*0.85));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  function molOrbit(x,y,rx,ry,rot,hue,alpha,lw){
    ctx.save();
    ctx.translate(x,y); ctx.rotate(rot);
    ctx.strokeStyle=hsl(hue,85,70,alpha);
    ctx.lineWidth=lw;
    ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function molSpoke(x,y,ang,len,rTip,hue,alpha){
    const x2=x+Math.cos(ang)*len, y2=y+Math.sin(ang)*len;
    ctx.strokeStyle=hsl(hue,80,65,alpha*0.85);
    ctx.lineWidth=Math.max(1.2,rTip*0.55);
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
    molSphere(x2,y2,rTip,hue,90,72,alpha);
  }

  for(const e of order){
    const pr=entProj.get(e.id);
    if(!pr) continue;
    const isLinked=linkedIds.has(e.id);
    const isExcited=(excitedUntil.get(e.id)||0)>time;
    const ph=e.vibratePhase||(e.id*1.7);
    const baseM=massOfKind(e.kind);
    const sc=massSizeScale(e.kind); // ∝ 1/masa; Ondina = 1 (más grande)
    const presence=massPresence(e.kind); // ∝ masa; Ondina plena, Aurion tenue
    const bFreq=massBreathFreq(e.kind);
    const breathAmp=0.028+0.035*sc;
    const breath=1+breathAmp*Math.sin(time*bFreq+ph);
    const rad=RAD_PX_UNIT*sc*pr.p*breath*(isLinked?1.04:1)*(isExcited?1.08:1);
    const hue=e.hue;
    const k=e.kind;
    const aCore=presence*(isExcited?1:0.92);

    // núcleo principal (esfera 3D estilizada) — alpha ∝ masa
    molSphere(pr.sx, pr.sy, rad, hue, isLinked||isExcited?92:78, isLinked||isExcited?70:58, aCore);

    // simbología por especie
    if(k==='e'){
      // almita: orbitales tipo átomo
      if(!lodHigh){
        molOrbit(pr.sx,pr.sy, rad*1.55, rad*0.55, time*0.7+ph, hue, 0.35*presence, 1.1*pr.p);
        molOrbit(pr.sx,pr.sy, rad*1.35, rad*0.5, -time*0.55+ph+1.0, (hue+40)%360, 0.28*presence, 1.0*pr.p);
      }
      molSphere(pr.sx+Math.cos(time*2+ph)*rad*1.2, pr.sy+Math.sin(time*2+ph)*rad*0.45, rad*0.22, hue, 95, 80, 0.7*presence);
    } else if(k==='p'||k==='A'){
      // núcleo / Aurion: terminales radiales (estrella molecular)
      const n=k==='A'?6:5;
      for(let i=0;i<n;i++){
        const ang=ph+i*(Math.PI*2/n)+time*0.15;
        molSpoke(pr.sx,pr.sy, ang, rad*(1.35+0.15*Math.sin(time*2+i)), rad*0.28, hue, 0.75*presence);
      }
    } else if(k==='n'){
      // eco: anillos concéntricos
      if(!lodHigh){
        ctx.strokeStyle=hsl(hue,70,65,0.35*presence);
        ctx.lineWidth=1.2*pr.p;
        ctx.beginPath(); ctx.arc(pr.sx,pr.sy,rad*1.35,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(pr.sx,pr.sy,rad*1.7,0,Math.PI*2); ctx.stroke();
      }
    } else if(k==='γ'){
      // luciérnaga: núcleo + 3 terminales brillantes
      for(let i=0;i<3;i++){
        const ang=time*3.2+i*(Math.PI*2/3)+ph;
        molSpoke(pr.sx,pr.sy, ang, rad*1.5, rad*0.26, 48, 0.85*presence);
      }
    } else if(k==='H'||k==='φ'){
      // náyade / áurea: orbitales + satélite
      if(!lodHigh){
        molOrbit(pr.sx,pr.sy, rad*1.6, rad*0.7, time*0.4+ph, hue, 0.4*presence, 1.3*pr.p);
        molOrbit(pr.sx,pr.sy, rad*1.25, rad*0.95, time*0.25+ph+0.8, (hue+30)%360, 0.3*presence, 1.0*pr.p);
      }
      molSphere(pr.sx+Math.cos(time*1.5+ph)*rad*1.35, pr.sy+Math.sin(time*1.5+ph)*rad*0.6, rad*0.32, hue, 90, 75, 0.8*presence);
    } else if(k==='X'){
      // umbra: tetrápoda
      for(let i=0;i<4;i++){
        const ang=ph+i*(Math.PI/2)+0.2*Math.sin(time*2);
        molSpoke(pr.sx,pr.sy, ang, rad*1.45, rad*0.3, hue, 0.8*presence);
      }
    } else if(k==='Ψ'){
      // ondina: lóbulo tipo orbital p
      ctx.save();
      ctx.translate(pr.sx,pr.sy);
      ctx.rotate(ph+time*0.3);
      const g2=ctx.createRadialGradient(0,-rad*0.6,0,0,-rad*0.6,rad*1.1);
      g2.addColorStop(0,hsl(hue,90,75,0.55*presence));
      g2.addColorStop(1,hsl(hue,80,50,0));
      ctx.fillStyle=g2;
      ctx.beginPath(); ctx.ellipse(0,-rad*0.55,rad*0.55,rad*0.95,0,0,Math.PI*2); ctx.fill();
      const g3=ctx.createRadialGradient(0,rad*0.6,0,0,rad*0.6,rad*1.1);
      g3.addColorStop(0,hsl(hue,90,75,0.55));
      g3.addColorStop(1,hsl(hue,80,50,0));
      ctx.fillStyle=g3;
      ctx.beginPath(); ctx.ellipse(0,rad*0.55,rad*0.55,rad*0.95,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      molSphere(pr.sx,pr.sy,rad*0.55,hue,95,80,0.95);
    }

    // highlight de enlace / excitación
    if(isLinked){
      ctx.strokeStyle=hsl(hue,90,80,0.25+0.1*Math.sin(time*3.5+e.id));
      ctx.lineWidth=1.2*pr.p;
      ctx.beginPath(); ctx.arc(pr.sx,pr.sy,rad*1.25,0,Math.PI*2); ctx.stroke();
    }
    if(e.crystallized&&e.moleculeId){
      // marco de coro: hexágono suave
      const R=rad*1.45;
      ctx.strokeStyle=hsl(48,90,70,0.35+0.12*Math.sin(time*2.2+e.id));
      ctx.lineWidth=1.15*pr.p;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=i*(Math.PI/3)+time*0.15;
        const px=pr.sx+Math.cos(a)*R, py=pr.sy+Math.sin(a)*R;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke();
    }
    const age=time-(e.spawnTime||0);
    if(age<0.45){
      const t=age/0.45;
      ctx.strokeStyle=hsl(hue,90,75,(1-t)*0.35);
      ctx.lineWidth=1.4*pr.p;
      ctx.beginPath(); ctx.arc(pr.sx,pr.sy,rad*0.5+(1-t*t)*22*pr.p,0,Math.PI*2); ctx.stroke();
    }
    if(e.id===playerId){
      ctx.strokeStyle=hsl(330,85,55,0.45);
      ctx.lineWidth=1.6*pr.p;
      ctx.beginPath(); ctx.arc(pr.sx,pr.sy,rad*1.4,0,Math.PI*2); ctx.stroke();
    }
    if(tugState.active&&e.id===tugState.leaderId){
      ctx.strokeStyle=hsl(42,90,60,0.5+0.2*Math.sin(time*3.5));
      ctx.lineWidth=2*pr.p;
      ctx.beginPath(); ctx.arc(pr.sx,pr.sy,rad*1.55,0,Math.PI*2); ctx.stroke();
    }
  }
  // visualización de entropía del sistema
  drawEntropyOverlay(ctx, W, H);
  drawFugaRetencionHUD(ctx, W, H);

  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.lineCap='butt';
}

}

/* ─── Destinos por etapas ───
   Etapa 1: invocar un paraje con cierta alma seleccionada.
   Etapas: tejer asociaciones/coros y disolverlas (sin eliminar materia).
   Condiciones del éter alineadas a formar o a disolver. */
const GOAL_KINDS=['e','p','n','γ','H','φ','A','X','Ψ'];
const SCENE_META={
  packet:{id:'packet', name:'Susurro', btn:'exPacket'},
  entangle:{id:'entangle', name:'Lazo de Ananké', btn:'exEntangle'},
  orbit:{id:'orbit', name:'Danza de Selene', btn:'exOrbit'},
  lattice:{id:'lattice', name:'Telar de Moiras', btn:'exLattice'},
  molecule:{id:'molecule', name:'Coro Nereida', btn:'exMolecule'},
  fission:{id:'fission', name:'Rayo de Febo', btn:'exFission'},
};
const SCENE_IDS=Object.keys(SCENE_META);
let goal=null;
let wins=0;
let lastSceneInvoke=null;
/* Contadores de partida (estilo Candy Crush: recolectar por mecánicas) */
const play={fusion:0, chorus:0, capture:0, collapse:0, fission:0, dissolve:0, associate:0, fago:0, lineage:0, byKind:{}, combo:0, chain:0, lastEventAt:0, score:0};
const PLAY_PTS={fusion:120, chorus:200, capture:80, collapse:90, fission:150, dissolve:140, associate:100, fago:70, lineage:220};
function resetPlay(){
  play.fusion=0; play.chorus=0; play.capture=0; play.collapse=0; play.fission=0; play.dissolve=0; play.associate=0; play.fago=0; play.lineage=0;
  play.byKind={}; play.combo=0; play.chain=0; play.lastEventAt=0; play.score=0;
  updateScoreUI();
}
function updateScoreUI(){ /* puntos/combos ocultos del panel Destino */ }
function flashCombo(n){
  const t=document.getElementById('comboToast');
  if(!t) return;
  // sin “Apoteosis” permanente: toast breve y labels cortas
  if(n<2){ t.classList.remove('show'); return; }
  const labels={2:'Doble',3:'Triple',4:'¡Éter!',5:'¡Marea!'};
  t.textContent=(labels[n]||('×'+n))+'  ·  +'+Math.round(40*n);
  t.classList.add('show');
  clearTimeout(flashCombo._tm);
  flashCombo._tm=setTimeout(()=>{ t.classList.remove('show'); t.textContent=''; }, 700);
}
function notePlay(ev, kind){
  if(play[ev]!=null) play[ev]++;
  if(kind){ play.byKind[kind]=(play.byKind[kind]||0)+1; }
  const chained=time-play.lastEventAt<1.35;
  if(chained){ play.chain++; play.combo++; }
  else play.chain=1;
  play.lastEventAt=time;
  const base=PLAY_PTS[ev]||50;
  const pts=Math.round(base*(1+(play.chain-1)*0.35));
  play.score+=pts;
  updateScoreUI();
  if(play.chain>=2) flashCombo(play.chain);
}

function countByKind(){
  const c={};
  for(const p of particles) c[p.kind]=(c[p.kind]||0)+1;
  return c;
}
function presentKinds(){
  return [...new Set(particles.map(p=>p.kind))];
}
function countCoros(){
  return new Set(particles.filter(p=>p.moleculeId).map(p=>p.moleculeId)).size;
}

function countStuckPairs(){
  let n=0;
  for(const L of softLinks.values()){
    if(L.stuck||(L.alpha||0)>0.28) n++;
  }
  return n;
}
function countClusterSizes(){
  /* tamaños de componentes por softLinks stuck + moleculeId */
  const parent=new Map();
  const find=id=>{
    if(!parent.has(id)) parent.set(id,id);
    if(parent.get(id)!==id) parent.set(id, find(parent.get(id)));
    return parent.get(id);
  };
  const uni=(a,b)=>{a=find(a);b=find(b); if(a!==b) parent.set(a,b);};
  for(const p of particles) parent.set(p.id,p.id);
  for(const L of softLinks.values()){
    if(L.stuck||(L.alpha||0)>0.28) uni(L.a,L.b);
  }
  for(const p of particles){
    if(p.moleculeId){
      for(const q of particles) if(q.moleculeId===p.moleculeId) uni(p.id,q.id);
    }
  }
  const sizes=new Map();
  for(const p of particles){
    const r=find(p.id);
    sizes.set(r,(sizes.get(r)||0)+1);
  }
  return [...sizes.values()];
}
function countAssociations(minSize=2){
  return countClusterSizes().filter(s=>s>=minSize).length;
}
function countAssociationMembers(minSize=2){
  return countClusterSizes().filter(s=>s>=minSize).reduce((a,b)=>a+b,0);
}

function iconOf(kind){
  return kindMeta[kind]?kindMeta[kind].label:'?';
}
function nameOf(kind){

}

/* Objetivos: formar y disolver asociaciones (nada se elimina del éter).
   La materia se reorganiza: lazos ↔ disolución al cambiar el medio o introducir un perturbador. */
function makeObjectiveStage(){
  const pool=['associate','chorus','dissolve','unbind','gather','fuse','fuseKind','capture','fago','lineage'];
  const type=pool[(Math.random()*pool.length)|0];
  if(type==='associate'){
    const minSize=Math.random()>0.45?3:2;
    const target=1+((Math.random()*2)|0);
    return {type, minSize, target, base:0, peak:0,
      label:`Teje ${target} asociación${target>1?'es':''} de ${minSize}+ almas`};
  }
  if(type==='chorus'){
    const target=1+((Math.random()*2)|0);
    return {type, target, base:0, label:`Forma ${target} coro${target>1?'s':''} (cristalización)`};
  }
  if(type==='dissolve'){
    const target=1+((Math.random()*2)|0);
    return {type, target, base:0, needPeak:true, peak:0, hadAssoc:false,
      label:`Disuelve ${target} asociación${target>1?'es':''} (coros o lazos)`};
  }
  if(type==='unbind'){
    const target=2+((Math.random()*3)|0);
    return {type, target, base:0, peak:0, hadPeak:false,
      label:`Afloja ${target} lazos (pares unidos → sueltos)`};
  }
  if(type==='gather'){
    const kind=GOAL_KINDS[(Math.random()*GOAL_KINDS.length)|0];
    const target=4+((Math.random()*4)|0);
    return {type, kind, target, label:`Reúne ${target} × ${iconOf(kind)} ${nameOf(kind)}`};
  }
  if(type==='fuse'){
    const target=2+((Math.random()*3)|0);
    return {type, target, base:0, label:`Logra ${target} conjunciones (fusiones)`};
  }
  if(type==='fuseKind'){
    const kind=['H','A','X','Ψ','φ'][(Math.random()*5)|0];
    const target=1+((Math.random()*2)|0);
    return {type, kind, target, base:0, label:`Forja ${target} × ${iconOf(kind)} ${nameOf(kind)} por conjunción`};
  }
  if(type==='capture'){
    const target=2+((Math.random()*3)|0);
    return {type, target, base:0, label:`Aurion captura ${target} almitas`};
  }
  if(type==='lineage'){
    const target=1+((Math.random()*2)|0);
    return {type:'lineage', target, base:0, label:`Restaura ${target} linaje${target>1?'s':''}`};
  }
  const target=2+((Math.random()*2)|0);
  return {type:'fago', target, base:0, label:`Incorporá ${target} almas (fagocitosis · masa se conserva)`};
}

function makeGoal(){
  const sceneId=SCENE_IDS[(Math.random()*SCENE_IDS.length)|0];
  const scene=SCENE_META[sceneId];
  const kind=GOAL_KINDS[(Math.random()*GOAL_KINDS.length)|0];
  const stage2=makeObjectiveStage();
  // a veces un tercer objetivo (combo Candy Crush)
  const stages=[
    {
      type:'invoke',
      sceneId,
      sceneName:scene.name,
      kind,
      label:`Invoca «${scene.name}» con ${iconOf(kind)} ${nameOf(kind)}`
    },
    stage2
  ];
  if(Math.random()>0.55){
    stages.push(makeObjectiveStage());
  }
  // formar lazos → vinculante; disolver → permitir abrir velo en la etapa
  const needsBind=stages.some(s=>['fago','fuse','fuseKind','chorus','capture','lineage','associate','gather'].includes(s.type));
  const needsDissolve=stages.some(s=>['dissolve','unbind'].includes(s.type));
  const conditions={
    marea: Math.random()>0.4,
    pulso: Math.random()>0.75,
    vinculante: needsDissolve&&!needsBind?false:(needsBind?true:Math.random()>0.45),
    allowVeloShift: needsDissolve,
  };
  const condBits=[];
  condBits.push(conditions.marea?'marea viva':'éter quieto');
  if(conditions.pulso) condBits.push('pulso activo');
  condBits.push(conditions.vinculante?'medio vinculante':'medio repulsivo');

  const titles=['Rito del Éter','Jugada etérea','Desafío de la marea','Conjuro del velo','Prueba de los lazos'];
  // movimientos al estilo Candy Crush (más etapas → más jugadas)
  const moves=10+stages.length*4+((Math.random()*4)|0);
  return {
    title:titles[(Math.random()*titles.length)|0],
    won:false,
    lost:false,
    stage:0,
    stars:0,
    startedAt:time,
    moves, movesMax:moves,
    conditions,
    stages,
    condText:condBits.join(' · ')
  };
}

function applyGoalConditions(g){
  const c=g.conditions;
  langevinOn=!!c.marea;
  const btnL=document.getElementById('btnLangevin');
  if(btnL){
    btnL.classList.toggle('on',langevinOn);
    btnL.textContent=langevinOn?'Marea ON':'Marea OFF · éter quieto';
  }
  pulseM=!!c.pulso;
  const btnP=document.getElementById('btnPulse');
  if(btnP) btnP.classList.toggle('on',pulseM);
  if(c.vinculante) setScale(0.12+Math.random()*0.18); // bien por debajo de 0.5 → fago/fusión
  else setScale(0.62+Math.random()*0.22);
  // si el rito pide fago, reforzá velo fino (por si el jugador subió el slider)
  if(g.stages&&g.stages.some(s=>['fago','associate','fuse','fuseKind','chorus'].includes(s.type))&&scale>=SCALE_MEAN) setScale(0.22);
  if(g.stages&&g.stages.some(s=>['dissolve','unbind'].includes(s.type))&&!g.stages.some(s=>['associate','chorus','fuse'].includes(s.type)))
    setScale(0.68);
}
function openVeloForDissolve(){
  // banda de disolución: scale ≳ 0.68 (disperseBias ≥ STUCK_BREAK_BIAS) + fatiga
  setScale(Math.max(scale, 0.70+Math.random()*0.12));
  reach=Math.max(reach, 0.28);
  const r=document.getElementById('reach'); if(r) r.value=reach;
  impulse=Math.min(1, impulse+0.18);
  log('El velo se espesa · los lazos entran en fatiga y pueden disolverse');
}


function stageDescHTML(st){
  if(st.type==='invoke')
    return `Selecciona <b style="font-size:1.2em">${iconOf(st.kind)}</b> ${nameOf(st.kind)} y abre <em>${st.sceneName}</em>.`;
  if(st.type==='associate')
    return `Teje <b>${st.target}</b> asociación${st.target>1?'es':''} de <b>${st.minSize}+</b> almas. Nadie desaparece: solo se unen.`;
  if(st.type==='chorus')
    return `Forma <b>${st.target}</b> <em>coro${st.target>1?'s':''}</em> (lazos que cristalizan).`;
  if(st.type==='dissolve')
    return `Disolvé <b>${st.target}</b> asociación${st.target>1?'es':''}: subí el velo, introducí ✦ o perturbá el coro. Las almas se separan; no se eliminan.`;
  if(st.type==='unbind')
    return `Aflojá <b>${st.target}</b> lazos (pares unidos → sueltos) cambiando el medio o un perturbador.`;
  if(st.type==='gather')
    return `Reúne <b>${st.target}</b> × <b style="font-size:1.2em">${iconOf(st.kind)}</b> ${nameOf(st.kind)}.`;
  if(st.type==='fuse')
    return `Logra <b>${st.target}</b> <em>conjunciones</em> (masa reorganizada, no borrada).`;
  if(st.type==='fuseKind')
    return `Forja <b>${st.target}</b> × <b style="font-size:1.2em">${iconOf(st.kind)}</b> ${nameOf(st.kind)} por fusión.`;
  if(st.type==='capture')
    return `<b style="font-size:1.2em">A</b> Aurion captura <b>${st.target}</b> almitas.`;
  if(st.type==='fago')
    return `Incorporá <b>${st.target}</b> almas (fagocitosis; masa y residual se conservan).`;
  if(st.type==='lineage')
    return `Restaura <b>${st.target}</b> linaje${st.target>1?'s':''}.`;
  return st.label||'…';
}

function shortLabel(st){
  if(st.type==='invoke') return `${iconOf(st.kind)} ${st.sceneName}`;
  if(st.kind) return `${iconOf(st.kind)} ${st.label||stageDescHTML(st).replace(/<[^>]+>/g,'')}`;
  return st.label||st.type;
}

/* Tips de fuerzas mágicas alineados al objetivo actual de Destino */
function tipsForStage(st, conditions){
  if(!st) return '';
  const k=st.kind, ico=k?iconOf(k):'', nom=k?nameOf(k):'';
  const velo=conditions?.vinculante
    ? '<strong>Velo fino</strong> — medio vinculante: las almas tejen lazos y coros.'
    : '<strong>Velo espeso</strong> — medio más repulsivo: los lazos se aflojan y los coros se disuelven.';
  const marea=conditions?.marea
    ? '<strong>Marea viva</strong> — agita órbitas; ayuda a desarmar agrupaciones.'
    : '<strong>Éter quieto</strong> — más predecible para tejer o soltar con cuidado.';
  const tips=[];
  if(st.type==='invoke'){
    tips.push(`<strong>Paraje</strong> — seleccioná <em>${ico} ${nom}</em> y tocá <em>${st.sceneName}</em>.`);
    tips.push(velo);
  } else if(st.type==='associate'){
    tips.push(`<strong>Asociación ${st.minSize}+</strong> — uní almas hasta ${st.target} grupo(s) con lazos o cristalización.`);
    tips.push('<strong>Velo fino</strong> — necesario para fijar lazos.');
    tips.push('<strong>Parajes</strong> — Coro Nereida o Telar de Moiras.');
    tips.push('<strong>Conservación</strong> — nadie se borra: solo se adhieren.');
  } else if(st.type==='chorus'){
    tips.push('<strong>Coro</strong> — átomos (≈ φ A X Ψ) con lazos fuertes cristalizan.');
    tips.push('<strong>Telar / Coro Nereida</strong> — siembran candidatos.');
    tips.push(velo);
  } else if(st.type==='dissolve'){
    tips.push('<strong>Disolver</strong> — se sueltan lazos y se parten coros; las almas siguen en el éter.');
    tips.push('<strong>Cómo</strong> — (1) subí el Velo ≳0.68 (fatiga→ruptura) · (2) separá pares o ✦ al coro · (3) marea ON / arrastre / Rayo de Febo.');
    tips.push('<strong>Orden</strong> — primero la asociación; luego la disolución.');
    tips.push(marea);
  } else if(st.type==='unbind'){
    tips.push('<strong>Aflojar lazos</strong> — reducí pares stuck.');
    tips.push('<strong>Velo espeso + marea</strong> — medio repulsivo y agite.');
    tips.push('<strong>Perturbador</strong> — una ✦ que cruce un lazo ayuda.');
    tips.push(velo);
  } else if(st.type==='gather'){
    tips.push(`<strong>Reunir ${ico}</strong> — despertá hasta ${st.target} × ${nom}.`);
    tips.push(velo);
  } else if(st.type==='fuse'||st.type==='fuseKind'){
    tips.push('<strong>Conjunción</strong> — subpartículas con lazos fuertes se reorganizan (masa se conserva).');
    tips.push('<strong>Velo fino</strong> — bajo la media.');
    if(st.type==='fuseKind') tips.push(`<strong>Producto</strong> — ${ico} ${nom}.`);
  } else if(st.type==='capture'){
    tips.push('<strong>Aurion A</strong> — atrae y captura almitas ·.');
    tips.push(marea);
  } else if(st.type==='fago'){
    tips.push('<strong>Incorporar</strong> — ☉ ≈ φ A X absorben: masa↑, residual; sin borrado.');
    tips.push('<strong>Velo bajo la media</strong> — medio vinculante.');
    tips.push(marea);
  } else if(st.type==='lineage'){
    tips.push('<strong>Linaje</strong> — fragmentos del mismo ancestro se restauran.');
    tips.push(velo); tips.push(marea);
  } else {
    tips.push(velo); tips.push(marea);
  }
  if(conditions?.pulso)
    tips.push('<strong>Pulso</strong> — oscila la mantisa y el ritmo de lazos.');
  return tips.join('<br>');
}

      '<strong>Coros</strong> — se forman y se disuelven; nadie se elimina del éter.<br>'+

function renderGoalUI(){
  if(!goal) return;
  const st=goal.stages[goal.stage];
  const stageMark=`${goal.stage+1}/${goal.stages.length}`;
  document.getElementById('goalTitle').textContent=goal.title+(goal.lost?' · fallido':goal.won?' · listo':' · '+stageMark);
  let list='<ul class="checklist">';
  goal.stages.forEach((s,i)=>{
    const cls=i<goal.stage?'done':(i===goal.stage&&!goal.won?'cur':'');
    const mark=i<goal.stage||goal.won?'✓':(i===goal.stage?'▸':'○');
    list+=`<li class="${cls}"><span class="ico">${mark}</span>${shortLabel(s)}</li>`;
  });
  list+='</ul>';
  document.getElementById('goalDesc').innerHTML=
    `<span style="opacity:.75">${goal.condText}</span><br>`+
    (goal.won||goal.lost?'':stageDescHTML(st)+'<br>')+list;
  updateMovesUI();
  updateLoreForGoal();
  const hint=document.getElementById('goalHint')||document.getElementById('labMode');
  if(hint){
    if(goal.lost) hint.textContent='sin movimientos';
    else if(goal.won) hint.textContent='✓ listo';
    else if(st.kind) hint.textContent=`${iconOf(st.kind)} ${st.type==='invoke'?st.sceneName:st.type}`;
    else hint.textContent=goal.title;
  }
  const btnR=document.getElementById('btnRetry');
  if(btnR) btnR.style.display=goal.lost?'':'none';
}

function spendMove(n=1){
  if(!goal||goal.won||goal.lost) return true;
  goal.moves=Math.max(0, goal.moves-n);
  updateMovesUI();
  if(goal.moves<=0){
    // aún puede ganar si el objetivo ya se cumple en este frame
    setTimeout(()=>{
      if(goal&&!goal.won&&goal.moves<=0) failGoal();
    }, 80);
  }
  return goal.moves>0||goal.won;
}
function failGoal(){
  if(!goal||goal.won||goal.lost) return;
  goal.lost=true;
  document.getElementById('goalBox').classList.add('lost');
  document.getElementById('goalProg').textContent='sin movimientos';
  renderGoalUI();
  const banner=document.getElementById('winBanner');
  banner.classList.add('show','lose');
  banner.querySelector('span').textContent='El Éter se cierra';
  const sub=document.getElementById('winSub');
  if(sub) sub.textContent='reintentar o nuevo destino';
  log('Rito fallido · sin movimientos');

}

function armStageCounters(st){
  if(!st) return;
  if(st.type==='fuse') st.base=play.fusion;
  if(st.type==='fuseKind') st.base=play.byKind[st.kind]||0;
  if(st.type==='chorus') st.base=play.chorus;
  if(st.type==='capture') st.base=play.capture;
  if(st.type==='fago') st.base=play.fago;
  if(st.type==='lineage') st.base=play.lineage;
  if(st.type==='dissolve'){ st.base=(play.dissolve||0)+(play.fission||0); st.peak=0; st.hadAssoc=false; }
  if(st.type==='unbind'){ st.peak=countStuckPairs(); st.hadPeak=st.peak>0; st.base=st.peak; }
  if(st.type==='associate'){ st.base=countAssociations(st.minSize||2); st.peak=st.base; }
  if((st.type==='dissolve'||st.type==='unbind')&&goal&&goal.conditions&&goal.conditions.allowVeloShift)
    openVeloForDissolve();
}
