function notifySceneInvoke(sceneId){
  lastSceneInvoke={sceneId, kind:placeKind, at:time};
  spendMove(1); // invocar paraje cuesta un movimiento
  if(!goal||goal.won||goal.lost) return;
  const st=goal.stages[goal.stage];
  if(st&&st.type==='invoke'&&st.sceneId===sceneId&&placeKind===st.kind){
    advanceGoalStage();
  }
}

function advanceGoalStage(){
  if(!goal||goal.won) return;
  if(goal.stage<goal.stages.length-1){
    goal.stage++;
    const st=goal.stages[goal.stage];
    armStageCounters(st);
    const pct=((goal.stage)/goal.stages.length)*100;
    document.getElementById('goalFill').style.width=pct.toFixed(1)+'%';
    document.getElementById('goalProg').textContent='¡etapa! · sigue…';
    renderGoalUI();
    log('Etapa cumplida · ahora: '+st.label);
    return;
  }
  goal.won=true;
  wins++;
  const elapsed=Math.max(1, time-(goal.startedAt||time));
  goal.stars=elapsed<40?3:elapsed<90?2:1;
  if(goal.stages.length>=3) goal.stars=Math.min(3, goal.stars+1);
  if(play.score>=800) goal.stars=Math.min(3, goal.stars+1);
  const starStr='★'.repeat(goal.stars)+'☆'.repeat(3-goal.stars);
  document.getElementById('goalBox').classList.add('won');
  document.getElementById('goalFill').style.width='100%';
  document.getElementById('goalProg').textContent=`${starStr} · ritos ${wins}`;
  updateScoreUI();
  const banner=document.getElementById('winBanner');
  banner.classList.add('show');
  banner.querySelector('span').textContent=goal.stars>=3?'El Éter sonríe ★★★':'El Éter sonríe';
  const sub=document.getElementById('winSub');
  if(sub) sub.textContent=`${starStr} · siguiente rito…`;
  const hint=document.getElementById('goalHint')||document.getElementById('labMode');
  if(hint) hint.textContent='✓ '+starStr;
  log('¡Victoria! '+starStr+' · '+goal.title);
  // flujo Candy Crush: celebra y pasa al siguiente nivel
  clearTimeout(advanceGoalStage._next);
  advanceGoalStage._next=setTimeout(()=>{
    banner.classList.remove('show');
    if(typeof fillAttrTable==='function') fillAttrTable();
  }, 3200);
}

function evaluateGoal(){
  if(!goal||goal.won||goal.lost) return;
  const st=goal.stages[goal.stage];
  if(!st) return;
  if(st.type==='invoke'){
    document.getElementById('goalFill').style.width=((goal.stage)/goal.stages.length*100).toFixed(1)+'%';
    document.getElementById('goalProg').textContent=`${iconOf(st.kind)} + «${st.sceneName}»`;
    return;
  }

  const counts=countByKind();
  let prog=0, total=1, done=false;
  const base=st.base||0;

  if(st.type==='gather'){
    prog=counts[st.kind]||0; total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`${iconOf(st.kind)} ${Math.min(prog,total)} / ${total}`;
  } else if(st.type==='associate'){
    const n=countAssociations(st.minSize||2);
    if(n>(st.peak||0)) st.peak=n;
    prog=n; total=st.target; done=n>=total;
    document.getElementById('goalProg').textContent=`asoc. ${Math.min(n,total)} / ${total} · lazos ${countStuckPairs()}`;
  } else if(st.type==='chorus'){
    const live=countCoros();
    prog=Math.max(play.chorus-base, live); total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`coros ${Math.min(prog,total)} / ${total} · vivos ${live}`;
  } else if(st.type==='dissolve'){
    const liveA=countAssociations(2);
    const liveC=countCoros();
    if(liveA+liveC>0) st.hadAssoc=true;
    if(liveA>(st.peak||0)) st.peak=liveA;
    const ev=(play.dissolve||0)+(play.fission||0)-base;
    if(st.hadAssoc&&liveA+liveC===0&&(st.peak||0)>=1){
      prog=Math.max(ev, st.target); total=st.target; done=true;
    } else {
      prog=ev; total=st.target; done=ev>=total;
    }
    document.getElementById('goalProg').textContent=done
      ?`disueltas ✓`
      :(st.hadAssoc?`disoluciones ${Math.min(prog,total)} / ${total} · vivas ${liveA+liveC}`
        :`primero teje un coro o lazo · luego disolvé`);
  } else if(st.type==='unbind'){
    const now=countStuckPairs();
    if(now>(st.peak||0)){ st.peak=now; st.hadPeak=true; }
    const freed=Math.max(0,(st.peak||0)-now);
    prog=st.hadPeak?freed:0; total=st.target; done=st.hadPeak&&freed>=total;
    document.getElementById('goalProg').textContent=done
      ?`lazos aflojados ✓`
      :(st.hadPeak?`sueltos ${Math.min(prog,total)} / ${total} · stuck ${now}`
        :`primero uní pares · stuck ${now}`);
  } else if(st.type==='fuse'){
    prog=play.fusion-base; total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`conjunciones ${Math.min(prog,total)} / ${total}`;
  } else if(st.type==='fuseKind'){
    prog=(play.byKind[st.kind]||0)-base; total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`${iconOf(st.kind)} forjadas ${Math.min(prog,total)} / ${total}`;
  } else if(st.type==='capture'){
    prog=play.capture-base; total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`capturas ${Math.min(prog,total)} / ${total}`;
  } else if(st.type==='fago'){
    prog=play.fago-base; total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`incorporadas ${Math.min(prog,total)} / ${total}`;
  } else if(st.type==='lineage'){
    prog=play.lineage-base; total=st.target; done=prog>=total;
    document.getElementById('goalProg').textContent=`linajes ${Math.min(prog,total)} / ${total}`;
  } else {
    document.getElementById('goalProg').textContent=st.label||st.type;
  }

  const stageBase=goal.stage/goal.stages.length;
  const slice=1/goal.stages.length;
  document.getElementById('goalFill').style.width=
    Math.min(100,(stageBase+slice*(total?Math.min(1,prog/total):0))*100).toFixed(1)+'%';

  if(done) advanceGoalStage();
}

function frame(){
  try{
    step();

    updateHUD();

    console.error('Éter frame:', err);

}

canvas.addEventListener('pointerdown',e=>{
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  canvas.setPointerCapture(e.pointerId);
  if(activePointers.size===1){
    dragging=true; moved=false; lastPtr={x:e.clientX,y:e.clientY};
  } else if(activePointers.size===2){
    dragging=false; // dos dedos: pasamos a modo pellizco, cancelamos rotación/tap
    const pts=[...activePointers.values()];
    pinchStartDist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartZoom=zoom;
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=canvas.getBoundingClientRect();
  pointerAim={nx:(e.clientX-r.left)/r.width, ny:(e.clientY-r.top)/r.height};
  if(activePointers.size>=2){
    const pts=[...activePointers.values()];
    const dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(pinchStartDist) zoom=Math.max(0.85,Math.min(5.5, pinchStartZoom*(dist/pinchStartDist)));
    moved=true;
    return;
  }
  if(!dragging||!lastPtr) return;
  const dx=e.clientX-lastPtr.x, dy=e.clientY-lastPtr.y;
  if(Math.hypot(dx,dy)>3) moved=true;
  // arrastre = rotación 3D del tablero (restaurada)
  rotY+=dx*0.008; rotX+=dy*0.008;
  const dImp=Math.hypot(dx,dy)*0.0022;
  impulse=Math.min(1,impulse+dImp); // arrastre → J (shock dosificable)
  // emisor: el arrastre también es fuga desde el foco de vista / último aim
  if(pointerAim && dImp>0.002){
    const wx=0.15+pointerAim.nx*0.7;
    const wy=0.15+pointerAim.ny*0.7;
    noteEmission(wx, wy, 0.5, Math.min(0.85, 0.25+dImp*8), 'drag');
  }
  lastPtr={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointerup',e=>{
  activePointers.delete(e.pointerId);
  if(activePointers.size<2) pinchStartDist=null;
  if(activePointers.size===0){
    if(!moved){
      // cada click invoca un alma; la primera (si agar está on) es la jugadora
      const r=canvas.getBoundingClientRect();
      pointerAim={nx:(e.clientX-r.left)/r.width, ny:(e.clientY-r.top)/r.height};
      const w=screenToWorld(e.clientX, e.clientY);
      const p=spawn(w.x, w.y, w.z, placeKind);
      if(agarOn && !getPlayer()){
        p.isPlayer=true;
        p.decayAt=null;
        playerId=p.id;
        log('Jugás · '+kindMeta[p.kind].name+' #'+p.id);
      }
    }
    dragging=false; lastPtr=null;
  } else if(activePointers.size===1){
    const remaining=[...activePointers.values()][0];
    dragging=true; moved=true;
    lastPtr={x:remaining.x,y:remaining.y};
  }
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); agarSplit(); }
  if(e.key==='g'||e.key==='G'){ agarOn=!agarOn; log(agarOn?'Agar ON':'Agar OFF'); }
  if(e.key==='h'||e.key==='H'){
    const modes=['bary','player','center'];
    const i=modes.indexOf(scaleExp.hitoMode);
    scaleExp.hitoMode=modes[(i+1)%modes.length];
    scaleExp.stableFrames=0;
    scaleExp.histRStar=[];
    log('Hito · '+scaleExp.hitoMode);
  }
});
canvas.addEventListener('pointercancel',e=>{
  activePointers.delete(e.pointerId);
  if(activePointers.size<2) pinchStartDist=null;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey){
    // trackpad: el pellizco llega como wheel+ctrlKey — lo tratamos como zoom, no como escala
    zoom=Math.max(0.85,Math.min(5.5,zoom*Math.exp(-e.deltaY*0.01)));
  } else if(e.shiftKey){
    scale=Math.max(0,Math.min(1,scale+e.deltaY*0.0012));
    document.getElementById('scale').value=scale;
    impulse=Math.min(1,impulse+0.05);
  } else {
    zoom=Math.max(0.85,Math.min(5.5,zoom*Math.exp(-e.deltaY*0.0015)));
  }
},{passive:false});

document.querySelectorAll('#sceneGrid .scene-cell').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#sceneGrid .scene-cell').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const fn=btn.dataset.ex;
    const map={exPacket,exEntangle,exOrbit,exLattice,exMolecule,exFission};
    if(fn&&map[fn]) map[fn]();
  });
});
function bindMedioLabel(id, lb){
  const el=document.getElementById(id), L=document.getElementById(lb);
  if(!el||!L) return;
  const sync=()=>{ L.textContent=(+el.value).toFixed(2); };
  el.addEventListener('input', sync); sync();
}

bindMedioLabel('m','lbM');
