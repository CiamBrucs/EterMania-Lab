<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éter-maníA.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Pacifico&family=Cormorant+Garamond:wght@500;600&display=swap');
  :root{
    --bg:#ffe6f2;--panel:#fff5fb;--line:rgba(255,140,180,.35);
    --c:#ff6ba8;--m:#ff9ec8;--g:#7edcc8;--t:#5a3a55;--u:#c080a0;
    --glow:#ffd0e8;--mist:#e8f4ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
      radial-gradient(ellipse at 20% 10%,#fff0f8 0%,transparent 50%),
      radial-gradient(ellipse at 80% 0%,#e8f4ff 0%,transparent 45%),
      radial-gradient(ellipse at 50% 100%,#ffe8f0 0%,#ffd6ea 40%,#f5e8ff 100%);
    color:var(--t);font-family:Outfit,system-ui,sans-serif;min-height:100vh;
    overflow-x:hidden;overflow-y:auto;
    display:flex;flex-direction:column;align-items:center;padding:.3rem .45rem 1rem}
  h1{font-family:Pacifico,cursive;font-size:1.55rem;font-weight:400;
    background:linear-gradient(120deg,#ff5a9e,#ff9ec8 40%,#7ec8f0 85%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.25;letter-spacing:.02em;
    filter:drop-shadow(0 2px 0 rgba(255,150,190,.35))}
  .sub{font:.52rem Outfit,sans-serif;color:var(--u);margin:.06rem 0 .22rem}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:.45rem;width:100%;max-width:1280px;align-items:start}
  @media(max-width:840px){.layout{grid-template-columns:1fr}}
  .stage{background:linear-gradient(165deg,#0a1020 0%,#060a14 50%,#080c18 100%);border:2px solid rgba(120,140,180,.35);
    border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 10px 32px rgba(0,0,20,.45), inset 0 0 40px rgba(30,50,90,.15)}
  .stage-h{display:none}
  #field{width:100%;aspect-ratio:1.25;min-height:300px;display:block;cursor:grab;touch-action:none}
  #field:active{cursor:grabbing}
  .side{display:flex;flex-direction:column}
  .card{background:linear-gradient(165deg,#fffafd 0%,#fff0f6 100%);border:2px solid rgba(255,160,190,.35);
    border-radius:18px;padding:.4rem .42rem;display:flex;flex-direction:column;gap:0;
    box-shadow:0 8px 28px rgba(255,120,170,.14)}
  .sec{font:.45rem Outfit,sans-serif;color:#e070a0;text-transform:uppercase;letter-spacing:.07em;
    margin:.16rem 0 .08rem;font-weight:700}
  .sec:first-child{margin-top:0}
  .row{display:flex;flex-wrap:wrap;gap:.15rem}
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:.1rem .32rem}
  .sliders label{margin:0}
  .sliders input[type=range]{margin:.05rem 0 .04rem}
  .regions-compact{margin-top:.12rem}
  .regions-compact summary{
    list-style:none;cursor:pointer;font:.48rem Outfit,sans-serif;color:#e070a0;text-transform:uppercase;
    letter-spacing:.06em;font-weight:700;padding:.28rem .4rem;border-radius:999px;
    background:linear-gradient(180deg,#fff,#ffe8f2);border:1.5px solid rgba(255,140,180,.4);
    box-shadow:0 2px 0 rgba(255,150,190,.2);user-select:none}
  .regions-compact summary::-webkit-details-marker{display:none}
  .regions-compact summary::after{content:' ▾'; float:right;opacity:.7}
  .regions-compact[open] summary::after{content:' ▴'}
  .regions-compact .regions-body{padding:.28rem .1rem .1rem}
  .regions-compact .sec{margin:.08rem 0 .02rem}
  .regions-compact .sliders{gap:.02rem .28rem}
  .regions-compact label{font-size:.42rem}
  .regions-compact input[type=range]{height:2px;margin:.02rem 0 .02rem}
  .regions-compact input[type=range]::-webkit-slider-thumb{width:8px;height:8px}
  .regions-compact .row{margin-top:.04rem!important}
  .regions-compact button{padding:.14rem .08rem;font-size:.44rem}
  button{flex:1;min-width:0;background:linear-gradient(180deg,#fff,#ffe8f2);color:var(--t);
    border:1.5px solid rgba(255,140,180,.4);border-radius:999px;padding:.22rem .14rem;
    font:.5rem Outfit,sans-serif;cursor:pointer;line-height:1.15;
    box-shadow:0 2px 0 rgba(255,150,190,.25)}
  button:hover{border-color:#ff7ab0;background:linear-gradient(180deg,#fff,#ffd6ea);transform:translateY(-1px)}
  button.on{color:#fff;border-color:#ff5a9e;background:linear-gradient(180deg,#ff8ec0,#ff5a9e);
    box-shadow:0 2px 8px rgba(255,90,158,.35)}
  button.el{flex:1;min-width:0;font-weight:700;padding:.2rem .04rem;font-size:.55rem;border-radius:50%}
  button.el[data-k=H]{color:#5a9ec8} button.el[data-k=e]{color:#4aa8e0}
  button.el[data-k=p]{color:#e06090} button.el[data-k=n]{color:#60b878}
  button.el[data-k=γ]{color:#e0a030} button.el[data-k=φ]{color:#c060d8}
  button.el[data-k=A]{color:#e09040} button.el[data-k=X]{color:#e050a0}
  button.el[data-k="Ψ"]{color:#30c0b0}
  button.el.on{color:#fff}
  label{display:flex;justify-content:space-between;font:.48rem Outfit,sans-serif;color:var(--u)}
  label b{color:var(--c);font-weight:600}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:#ffd0e4;border-radius:3px;margin:.06rem 0 .1rem}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:linear-gradient(135deg,#ff8ec0,#ff5a9e);cursor:pointer;border:2px solid #fff;
    box-shadow:0 1px 5px rgba(255,100,160,.45)}
  .lore{font:.5rem Outfit,sans-serif;line-height:1.4;color:#a06080;
    background:linear-gradient(135deg,#fff5fa,#f0f6ff);border-radius:12px;padding:.3rem .35rem;
    border:1.5px solid rgba(255,160,190,.3);margin-top:.12rem}
  .lore strong{color:#ff5a9e;font-weight:600}
  .lore em{color:#e070c0;font-style:normal}
  .scenes{display:grid;grid-template-columns:1fr 1fr;gap:.12rem}
  .scenes button{font-size:.48rem;padding:.2rem .1rem}
  .goal{margin-top:.14rem;padding:.32rem .36rem;border-radius:14px;
    background:linear-gradient(145deg,#fff0f6,#f5e8ff);border:2px solid rgba(255,140,180,.4);
    box-shadow:inset 0 1px 0 #fff}
  .goal.won{border-color:rgba(100,210,180,.7);background:linear-gradient(145deg,#e8fff6,#f0f8ff)}
  .goal-title{font:.48rem Outfit,sans-serif;color:#ff5a9e;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .goal-desc{font:.58rem Outfit,sans-serif;color:#5a3a55;margin:.12rem 0 .14rem;line-height:1.35}
  .goal-bar{height:6px;background:#ffd6ea;border-radius:4px;overflow:hidden}
  .goal-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff8ec0,#7ec8f0,#ffb0d0);border-radius:4px;transition:width .2s}
  .goal.won .goal-fill{background:linear-gradient(90deg,#7edcc8,#ff9ec8)}
  .goal-prog{font:.46rem Outfit,sans-serif;color:#c080a0;margin-top:.1rem}
  .goal-score{font:.5rem Outfit,sans-serif;color:#e09040;margin-top:.08rem;letter-spacing:.03em}
  .goal-moves{font:.5rem Outfit,sans-serif;color:#6090c8;margin-top:.06rem}
  .goal-moves.low{color:#e05070}
  .goal.lost{border-color:rgba(240,120,140,.55);background:linear-gradient(145deg,#ffe8ec,#fff0f4)}
  .checklist{margin:.1rem 0 0;padding:0;list-style:none}
  .checklist li{font:.5rem Outfit,sans-serif;color:#c080a0;padding:.08rem 0;border-bottom:1px solid rgba(255,160,190,.2)}
  .checklist li.done{color:#40b898;text-decoration:line-through;opacity:.85}
  .checklist li.cur{color:#5a3a55;font-weight:600}
  .checklist li .ico{margin-right:.2rem}
  .win-banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:.35rem;background:rgba(255,230,245,.72);pointer-events:none;z-index:2}
  .win-banner.show{display:none!important}
  .win-banner span{font-family:Pacifico,cursive;font-size:1.7rem;color:#ff5a9e;
    text-shadow:0 2px 0 #fff,0 0 20px rgba(255,150,200,.6);letter-spacing:.03em}
  .win-banner .win-sub{font:.7rem Outfit,sans-serif;color:#e09040}
  .win-banner.lose span{color:#e05070;text-shadow:0 2px 0 #fff,0 0 16px rgba(240,100,130,.4)}
  .stage{position:relative}
  .combo-toast{display:none}

  /* ── Ficha de laboratorio (formato hoja de personaje) ── */
  .sheet{display:flex;flex-direction:column;gap:.35rem}
  .sheet-panel{background:linear-gradient(180deg,#e8ecf2 0%,#d8dee8 100%);
    border:2px solid #9aa8bc;border-radius:14px;padding:.35rem .38rem .4rem;
    box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(40,50,70,.12);position:relative}
  .sheet-panel.almas{background:linear-gradient(180deg,#eceff4,#d5dbe6)}
  .sheet-head{position:absolute;top:-.55rem;left:50%;transform:translateX(-50%);
    background:#1a1e28;color:#f0f4f8;font:.55rem Outfit,sans-serif;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:.18rem .7rem;border-radius:999px;
    white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .sheet-head.soft{background:#2a3344}
  .soul-pick{display:flex;flex-wrap:wrap;gap:.18rem;justify-content:center;margin:.45rem 0 .3rem}
  .soul-pick .el{width:1.65rem;height:1.65rem;border-radius:8px;font-size:.72rem;
    border:1.5px solid #8a9bb0;background:#f4f6fa;color:#2a3548;padding:0}
  .soul-pick .el.on{background:#2a3548;color:#fff;border-color:#1a2030;box-shadow:0 0 0 2px rgba(100,140,200,.35)}
  .abil{display:flex;align-items:stretch;gap:.35rem;margin:.22rem 0}
  .abil-box{min-width:4.2rem;width:4.2rem;border:2px solid #5a6a80;border-radius:10px;
    background:#f7f8fb;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:.28rem .15rem;box-shadow:inset 0 1px 0 #fff}
  .abil-val{font:700 1.05rem Outfit,sans-serif;color:#1a2030;line-height:1}
  .abil-name{font:.38rem Outfit,sans-serif;color:#4a5a70;text-transform:uppercase;
    letter-spacing:.04em;margin-top:.12rem;text-align:center;font-weight:700}
  .abil-skills{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.06rem;
    border-top:1px solid #a0aec0;border-bottom:1px solid #a0aec0;padding:.12rem 0 .12rem .15rem}
  .abil-skills span{font:.42rem Outfit,sans-serif;color:#3a4a5c;display:flex;align-items:center;gap:.25rem}
  .abil-skills i{width:.42rem;height:.42rem;border-radius:50%;border:1.5px solid #5a6a80;
    display:inline-block;flex-shrink:0;background:#f7f8fb}
  .abil-skills i.on{background:#4a90d0;border-color:#2a5080}
  .sheet-panel.escenarios{padding:.28rem .3rem .22rem;margin-top:.15rem}
  .sheet-panel.escenarios .sheet-head{font:.48rem Outfit,sans-serif;padding:.12rem .5rem}
  .scene-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,auto);
    gap:.12rem .14rem;margin:.42rem 0 .08rem}
  .scene-cell{border:1.5px solid #6a7a90;border-radius:6px;aspect-ratio:auto;min-height:0;
    height:1.15rem;background:#f4f6fa;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font:.36rem Outfit,sans-serif;font-weight:700;color:#2a3548;cursor:pointer;
    text-transform:uppercase;letter-spacing:.03em;padding:0 .12rem;line-height:1;
    box-shadow:inset 0 1px 0 #fff}
  .scene-cell:hover{background:#e8eef8}
  .scene-cell.on{background:#2a3548;color:#fff;border-color:#1a2030}
  .scene-cell.hex{border-radius:6px}
  .medio-body{margin-top:.55rem;padding:0 .1rem .15rem}
  .medio-body .sliders{display:flex;flex-direction:column;gap:.28rem}
  .medio-body label{display:flex;justify-content:space-between;font:.48rem Outfit,sans-serif;
    color:#3a4a5c;font-weight:600;margin-bottom:.06rem}
  .medio-body label b{color:#1a2030;font-weight:700}
  .medio-body input[type=range]{width:100%;accent-color:#4a6a90}
  .medio-actions{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.35rem}
  .medio-actions button{font-size:.48rem;padding:.22rem .4rem;border-radius:8px;
    border:1.5px solid #6a7a90;background:#f0f3f8;color:#2a3548;cursor:pointer;font-weight:600}
  .medio-actions button.on{background:#2a3548;color:#fff}
  .sheet .sec{display:none}

  .goal{display:none!important}
  .win-banner{display:none!important}
  .attr-table-wrap{max-height:11rem;overflow:auto;margin:.1rem 0 .2rem;
    border:1px solid rgba(120,160,200,.2);border-radius:10px;background:rgba(12,20,36,.45)}
  .attr-table{width:100%;border-collapse:collapse;font:.42rem Outfit,sans-serif;color:#8aa0b8}
  .attr-table th{text-align:left;padding:.18rem .28rem;color:#6a90b0;font-weight:600;
    border-bottom:1px solid rgba(100,140,180,.25);position:sticky;top:0;background:#0c1424}
  .attr-table td{padding:.14rem .28rem;border-bottom:1px solid rgba(80,110,140,.12)}
  .attr-table tr.on td{background:rgba(80,140,200,.12);color:#c8e0f0}
  .attr-table .sym{font-size:.72rem;color:#b0d0f0;width:1.4rem}
  .attr-table .nm{color:#90a8c0;font-size:.4rem}

  .win-banner{display:none!important}
  .field-metrics{font:.40rem Outfit,sans-serif;color:#6a8098;line-height:1.35;
    background:rgba(20,30,50,.06);border-radius:8px;padding:.18rem .32rem;margin:.12rem 0}
  .field-metrics b{color:#c45a7a;font-weight:600}
  .field-metrics .em{color:#3a7a9a;font-size:.36rem}
  .field-metrics.cascade-hot{background:rgba(255,80,100,.12);color:#a05060;
    box-shadow:0 0 0 1px rgba(255,100,120,.25) inset}
  .field-metrics .hot{color:#e04060;font-weight:700}
  .cascade-log{font:.36rem Outfit,sans-serif;color:#7a90a8;max-height:2.6rem;overflow:hidden;
    margin-top:.1rem;line-height:1.3;opacity:.9}

</style>
</head>
<body>
  <h1>Éter-maníA. <span style="font-size:.55em;font-weight:500;color:#7a9ab8">laboratorio</span></h1>
  <div class="layout">
    <div class="stage">
      <div class="stage-h"><span id="umbral">ÉTER SUTIL</span><span id="labMode" style="color:#7a9ab8">laboratorio</span></div>
      <canvas id="field"></canvas>
    </div>
    <div class="side">
      <div class="sheet">
        <!-- ALMAS -->
        <div class="sheet-panel almas">
          <div class="sheet-head">Almas</div>
          <div class="soul-pick" id="soulPick">
            <button class="el on" data-k="e" title="Almita">·</button>
            <button class="el" data-k="p" title="Núcleo">☉</button>
            <button class="el" data-k="n" title="Eco">◌</button>
            <button class="el" data-k="γ" title="Luciérnaga">✦</button>
            <button class="el" data-k="H" title="Náyade">≈</button>
            <button class="el" data-k="φ" title="Áurea">φ</button>
            <button class="el" data-k="A" title="Aurion">A</button>
            <button class="el" data-k="X" title="Umbra">X</button>
            <button class="el" data-k="Ψ" title="Ondina">Ψ</button>
          </div>
          <div id="abilStack">
            <div class="abil" data-attr="mass">
              <div class="abil-box"><div class="abil-val" id="avMass">—</div><div class="abil-name">Masa</div></div>
              <div class="abil-skills" id="skMass"></div>
            </div>
            <div class="abil" data-attr="charge">
              <div class="abil-box"><div class="abil-val" id="avCharge">—</div><div class="abil-name">Carga</div></div>
              <div class="abil-skills" id="skCharge"></div>
            </div>
            <div class="abil" data-attr="affinity">
              <div class="abil-box"><div class="abil-val" id="avAff" style="font-size:.62rem">—</div><div class="abil-name">Afinidad</div></div>
              <div class="abil-skills" id="skAff"></div>
            </div>
          </div>
        </div>

        <!-- ESCENARIOS -->
        <div class="sheet-panel escenarios">
          <div class="sheet-head">Escenarios</div>
          <div class="scene-grid" id="sceneGrid">
            <button type="button" class="scene-cell hex" data-ex="exPacket">Susurro</button>
            <button type="button" class="scene-cell" data-ex="exEntangle">Ananké</button>
            <button type="button" class="scene-cell" data-ex="exOrbit">Selene</button>
            <button type="button" class="scene-cell hex" data-ex="exLattice">Telar</button>
            <button type="button" class="scene-cell hex" data-ex="exMolecule">Coro</button>
            <button type="button" class="scene-cell" data-ex="exFission">Febo</button>
          </div>
        </div>


        <!-- PARÁMETROS DEL MEDIO -->
        <div class="sheet-panel">
          <div class="sheet-head soft">parámetros del medio</div>
          <div class="medio-body">
            <div class="sliders">
              <div>
                <label>Velo <b id="lbScale">0.20</b></label>
                <input type="range" id="scale" min="0" max="1" step="0.01" value="0.2">
              </div>
              <div>
                <label>Pulso <b id="lbM">1.00</b></label>
                <input type="range" id="m" min="0.3" max="2.4" step="0.02" value="1.0">
              </div>
              <div>
                <label>Sutileza <b id="lbHbar">1.00</b></label>
                <input type="range" id="hbar" min="0.3" max="2.2" step="0.02" value="1.0">
              </div>
              <div>
                <label>Lazo <b id="lbReach">0.26</b></label>
                <input type="range" id="reach" min="0.1" max="0.4" step="0.01" value="0.26">
              </div>
              <div>
                <label>Fervor <b id="lbKT">0.02</b></label>
                <input type="range" id="kT" min="0" max="0.12" step="0.002" value="0.02">
              </div>
              <div>
                <label>Espesor <b id="lbGamma">0.40</b></label>
                <input type="range" id="gamma" min="0" max="2" step="0.02" value="0.40">
              </div>
            </div>
            <div class="medio-actions">
              <button id="btnLangevin" class="on">Marea ON</button>
              <button id="btnClear">Disipar</button>
              <button id="btnPulse">Pulso</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
<script>
/* Lightweight quantum-particle lab — no heavy 3D grid PDE */
const HIST=80;
const historyD=[], historyS=[], historyL=[];
const particles=[]; // wave-packet particles
const softLinks=new Map();
/* Separación entre centros = BOND_SEP_UNITS × (ra+rb)
   Tamaño ilustrativo ∝ masa (lineal). Unidad: Ondina Ψ = 0.55 → radio base. */
const BOND_SEP_UNITS=2.5;
/* Inversión visual de prueba:
   tamaño en pantalla ∝ 1/masa  (Ondina grande, Aurion chico)
   presencia (alpha)  ∝ masa    (Ondina plena, Aurion más transparente)
   Física de lazos: radio de mundo sigue ∝ masa (inercia / separación corporal). */
const MASS_UNIT=0.55;          // Ondina: masa mínima
const MASS_MAX=5.4;            // Aurion: masa máxima
const RAD_PX_UNIT=7.2;         // radio px de referencia (escala media-alta)
const RAD_WORLD_UNIT=0.014;    // radio mundo a masa = MASS_UNIT (física)
/* Tamaños relativos conservan el orden, pero los extremos se aproximan:
   mapeo de (1/m) normalizado → banda [SIZE_LO .. SIZE_HI] (~±25% del centro). */
const SIZE_LO=0.72;            // Aurion (más masivo → más chico, pero no minúsculo)
const SIZE_HI=1.22;            // Ondina (más liviana → más grande, sin desbordar)
const PRES_LO=0.42;            // Aurion: transparente pero legible
const PRES_HI=0.96;            // Ondina: casi plena
function massOfKind(kind){
  return Math.max(0.05, kindMeta[kind]?.mass||1);
}
/** t∈[0,1]: 0 = masa máx (Aurion), 1 = masa mín (Ondina) — eje inverso a m */
function massInvNorm(kind){
  const inv=MASS_UNIT/massOfKind(kind);
  const invMin=MASS_UNIT/MASS_MAX;
  return Math.max(0, Math.min(1, (inv-invMin)/(1-invMin)));
}
/** t∈[0,1]: 0 = Ondina, 1 = Aurion — eje directo a m */
function massNorm(kind){
  return Math.max(0, Math.min(1, (massOfKind(kind)-MASS_UNIT)/Math.max(1e-6, MASS_MAX-MASS_UNIT)));
}
/** Tamaño ilustrativo: orden ∝ 1/m, extremos comprimidos */
function massSizeScale(kind){
  const t=massInvNorm(kind); // 1 Ondina … 0 Aurion
  return SIZE_LO + (SIZE_HI-SIZE_LO)*t;
}
/** Presencia ∝ m, extremos suavizados */
function massPresence(kind){
  const t=massNorm(kind); // 0 Ondina … 1 Aurion
  // más masa → menos opacidad, pero dentro de [PRES_LO, PRES_HI]
  return PRES_HI - (PRES_HI-PRES_LO)*t;
}
/** Física: radio de cuerpo sigue creciendo con masa */
function massPhysScale(kind){
  return massOfKind(kind)/MASS_UNIT;
}
function massBreathFreq(kind){
  return 0.85 + 1.1*massSizeScale(kind);
}
function bodyRadiusWorld(p){
  return RAD_WORLD_UNIT*massPhysScale(p.kind);
}
function sepIdealWorld(a,b){
  return BOND_SEP_UNITS*(bodyRadiusWorld(a)+bodyRadiusWorld(b));
}
/* Refuerza lazos aún no consolidados (no stuck) en la vecindad de p */
function strengthenNascentLinks(p, amount){
  if(!p||amount<=0) return;
  for(const L of softLinks.values()){
    if(L.stuck) continue;
    if(L.a!==p.id&&L.b!==p.id) continue;
    L.target=Math.min(0.55, (L.target||0)+amount);
    L.alpha=Math.min(0.5, (L.alpha||0)+amount*0.65);
    L.agency=(L.agency||0)+amount*1.2;
  }
}

/* ─── Experimento de escala: hito → capas r → R(r) → r* ───
   Pi + medio + Phi → R
   1 hito | 2 relación hito–medio | 3 residual → vuelve a 1' */
const SCALE_RADII=[0.80,0.60,0.44,0.30,0.20,0.12,0.06];
let scaleExp={
  hitoMode:'bary', // 'bary' | 'player' | 'center'
  hito:{x:0.5,y:0.5,z:0.5},
  layers:[],
  rStar:null,
  rStarR:null,
  stableFrames:0,
  histRStar:[], // últimos r* para estabilidad
  synthAtStar:0,
};
function getScaleHito(){
  if(scaleExp.hitoMode==='center') return {x:0.5,y:0.5,z:0.5};
  if(scaleExp.hitoMode==='player'){
    const pl=getPlayer();
    if(pl) return {x:pl.x,y:pl.y,z:pl.z};
  }
  // baricentro de masa (default)
  if(!particles.length) return {x:0.5,y:0.5,z:0.5};
  let mx=0,my=0,mz=0,m=0;
  for(const p of particles){ mx+=p.x*p.mass; my+=p.y*p.mass; mz+=p.z*p.mass; m+=p.mass; }
  if(m<1e-6) return {x:0.5,y:0.5,z:0.5};
  return {x:mx/m,y:my/m,z:mz/m};
}
function distHito(p,h){
  return Math.hypot(p.x-h.x,p.y-h.y,p.z-h.z);
}
/** Complejidad relacional R dentro de la bola de radio r alrededor del hito.
 *  Baja cuando hay síntesis: muchas unidades, pocas componentes independientes,
 *  trayectorias compartidas (poca dispersión de velocidad relativa). */
function measureR(hito,r){
  const inside=particles.filter(p=>distHito(p,hito)<=r);
  const n=inside.length;
  if(n===0) return {r,n:0,comps:0,mass:0,disp:0,stuckFrac:0,R:0,synth:0};
  const ids=new Set(inside.map(p=>p.id));
  // componentes = UF por vínculos stuck / moleculeId
  const parent=new Map();
  for(const p of inside) parent.set(p.id,p.id);
  function find(i){ while(parent.get(i)!==i){ parent.set(i,parent.get(parent.get(i))); i=parent.get(i);} return i; }
  function uni(a,b){ a=find(a); b=find(b); if(a!==b) parent.set(a,b); }
  for(const p of inside){
    if(p.moleculeId){
      for(const q of inside) if(q.moleculeId===p.moleculeId) uni(p.id,q.id);
    }
  }
  for(const L of softLinks.values()){
    if(L.alpha<0.2&&!L.stuck) continue;
    if(!ids.has(L.a)||!ids.has(L.b)) continue;
    uni(L.a,L.b);
  }
  const roots=new Set();
  for(const p of inside) roots.add(find(p.id));
  const comps=roots.size;
  let mass=0, vx=0,vy=0,vz=0;
  for(const p of inside){ mass+=p.mass; vx+=p.vx; vy+=p.vy; vz+=p.vz; }
  vx/=n; vy/=n; vz/=n;
  let disp=0;
  for(const p of inside) disp+=(p.vx-vx)**2+(p.vy-vy)**2+(p.vz-vz)**2;
  disp=Math.sqrt(disp/n);
  const stuckFrac=n>0?1-comps/n:0;
  // R: costo de descripción — más componentes y más dispersión ⇒ R mayor
  // síntesis (stuckFrac) comprime R
  const R=comps*(0.35+disp*8)*(1.15-0.7*stuckFrac);
  const synth=stuckFrac;
  return {r,n,comps,mass,disp,stuckFrac,R,synth};
}
function updateScaleExperiment(){
  const h=getScaleHito();
  scaleExp.hito=h;
  const layers=SCALE_RADII.map(r=>measureR(h,r));
  scaleExp.layers=layers;
  // r* = radio con R mínima entre capas con al menos 2 almas
  let best=null;
  for(const L of layers){
    if(L.n<2) continue;
    if(!best||L.R<best.R) best=L;
  }
  if(best){
    scaleExp.histRStar.push(best.r);
    if(scaleExp.histRStar.length>24) scaleExp.histRStar.shift();
    // estabilidad: moda reciente
    const freq=new Map();
    for(const rr of scaleExp.histRStar) freq.set(rr,(freq.get(rr)||0)+1);
    let mode=best.r, modeN=0;
    for(const [rr,c] of freq) if(c>modeN){ mode=rr; modeN=c; }
    if(scaleExp.rStar===mode) scaleExp.stableFrames++;
    else scaleExp.stableFrames=0;
    scaleExp.rStar=mode;
    const atMode=layers.find(L=>L.r===mode);
    scaleExp.rStarR=atMode?atMode.R:best.R;
    scaleExp.synthAtStar=atMode?atMode.synth:best.synth;
  } else {
    scaleExp.rStar=null;
    scaleExp.rStarR=null;
    scaleExp.stableFrames=0;
  }
}
function drawScaleRings(cx,cy,s3){
  const h=scaleExp.hito;
  const layers=scaleExp.layers;
  if(!layers.length) return;
  // planos esféricos: el aro de influencias rota y pivotea
  const spin=time*0.55;
  const tilt=0.55+0.35*Math.sin(time*0.31);
  const roll=time*0.42;
  const ux=Math.sin(roll)*Math.cos(tilt);
  const uy=Math.cos(roll);
  const uz=Math.sin(roll)*Math.sin(tilt);
  let bx=1, by=0, bz=0;
  if(Math.abs(uy)<0.9){ bx=0; by=1; bz=0; }
  let e1x=uy*bz-uz*by, e1y=uz*bx-ux*bz, e1z=ux*by-uy*bx;
  let e1n=Math.hypot(e1x,e1y,e1z)+1e-9;
  e1x/=e1n; e1y/=e1n; e1z/=e1n;
  const e2x=uy*e1z-uz*e1y, e2y=uz*e1x-ux*e1z, e2z=ux*e1y-uy*e1x;

  for(let li=0;li<layers.length;li++){
    const L=layers[li];
    const isStar=scaleExp.rStar!=null&&Math.abs(L.r-scaleExp.rStar)<1e-9;
    // gamas escaladas de rojos (campo de influencias)
    const t=li/(Math.max(1,layers.length-1));
    const red=200+Math.floor(55*(1-t));
    const g=35+Math.floor(28*t+18*Math.sin(time*0.7+li));
    const b=50+Math.floor(36*t);
    const baseA=isStar?0.20:0.035+0.045*(L.synth||0);
    const steps=56;
    // desdibujado: varias pasadas suaves
    for(let pass=0;pass<3;pass++){
      const jitter=pass*0.007;
      const a=(baseA*(1-pass*0.3))*(isStar?1.3:1);
      ctx.beginPath();
      for(let i=0;i<=steps;i++){
        const ang=i/steps*Math.PI*2+spin*(isStar?1.15:0.55);
        const rr=L.r*(1+jitter*Math.sin(ang*3+pass));
        const px=h.x+(e1x*Math.cos(ang)+e2x*Math.sin(ang))*rr;
        const py=h.y+(e1y*Math.cos(ang)+e2y*Math.sin(ang))*rr;
        const pz=h.z+(e1z*Math.cos(ang)+e2z*Math.sin(ang))*rr;
        const pr=project(px-0.5,py-0.5,pz-0.5,cx,cy,s3);
        if(i===0) ctx.moveTo(pr.sx,pr.sy); else ctx.lineTo(pr.sx,pr.sy);
      }
      ctx.closePath();
      ctx.strokeStyle=`rgba(${red},${g},${b},${a.toFixed(3)})`;
      ctx.lineWidth=(isStar?1.35:0.5)+pass*0.4;
      ctx.stroke();
    }
  }
  // centro del hito: marca mínima (el campo es el aro, no el punto)
  {
    const prC=project(h.x-0.5,h.y-0.5,h.z-0.5,cx,cy,s3);
    const pulse=0.5+0.5*Math.sin(time*1.8);
    ctx.fillStyle=`rgba(255,75,95,${(0.22+0.12*pulse).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(prC.sx,prC.sy,2*prC.p,0,Math.PI*2); ctx.fill();
  }
}

/* Construye un muro compartimentado en el plano y-z (grosor en x) con N
   aperturas rectangulares reales — usado por Túnel (0 aperturas = sólido
   completo, sin bordes libres) y Doble Rendija (2 aperturas separadas). */
function buildPartitionedWall(x0,x1, y0,y1, z0,z1, apertures){
  const boxes=[];
  const sorted=[...apertures].sort((a,b)=>a.y0-b.y0);
  let cursorY=y0;
  for(const ap of sorted){
    if(ap.y0>cursorY) boxes.push({x0,x1,y0:cursorY,y1:ap.y0,z0,z1});
    if(ap.z0>z0) boxes.push({x0,x1,y0:ap.y0,y1:ap.y1,z0,z1:ap.z0});
    if(ap.z1<z1) boxes.push({x0,x1,y0:ap.y0,y1:ap.y1,z0:ap.z1,z1});
    cursorY=ap.y1;
  }
  if(cursorY<y1) boxes.push({x0,x1,y0:cursorY,y1,z0,z1});
  return boxes;
}


let scale=0.2, mantisa=1, hbar=1, reach=0.26;
let langevinOn=true, langevinKT=0.02, langevinGamma=0.40; // termostato Langevin (kT, γ)
/* Histéresis térmica: memoria de camino kT↑ vs kT↓ */
const thermalHys={
  kTPrev:0.02,
  dir:0,           // +1 calentamiento, -1 enfriamiento, 0
  kTOff:null,      // kT donde cayó el orden al calentar
  kTOn:null,       // kT donde reapareció orden al enfriar
  peakKT:0.02,     // máximo kT del ciclo actual
  wasHot:false,    // estuvo en zona caliente este ciclo
  orderMem:0,      // orden reciente (stuck/coro proxy)
  residual:0       // daño térmico residual [0..1] (metaestabilidad)
};
function thermalOrderProxy(){
  let stuck=0, n=0;
  for(const L of softLinks.values()){ n++; if(L.stuck) stuck++; }
  let coros=0;
  const seen=new Set();
  for(const p of particles){
    if(p.moleculeId&&!seen.has(p.moleculeId)){ seen.add(p.moleculeId); coros++; }
  }
  const pStuck=n?stuck/Math.max(1,n):0;
  return Math.min(1, 0.55*pStuck + 0.45*Math.min(1,coros/3));
}
/* ── Entropía del sistema (nats) ──
   S_link  : ocupación stuck/libre de lazos
   S_clus  : distribución de tamaños de coro
   S_kin   : dispersión de velocidades (proxy)
   S       : combinación para visualización */
const entropyState={S:0, S_link:0, S_clus:0, S_kin:0, pStuck:0, hist:[]};
function computeSystemEntropy(){
  let nLinks=0, nStuck=0;
  for(const L of softLinks.values()){
    nLinks++;
    if(L.stuck) nStuck++;
  }
  // si hay pocos softLinks, estimar P desde pares cercanos
  let p=nLinks>0?nStuck/nLinks:0;
  if(nLinks<3 && particles.length>=2){
    let near=0, nearStuck=0;
    const r=(typeof reach==='number'?reach:0.28);
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const a=particles[i], b=particles[j];
        const d=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
        if(d>r) continue;
        near++;
        const L=softLinks.get(linkKey(a.id,b.id));
        if(L&&L.stuck) nearStuck++;
      }
    }
    if(near>0) p=nearStuck/near;
  }
  p=Math.max(1e-6, Math.min(1-1e-6, p));
  const S_link=-(p*Math.log(p)+(1-p)*Math.log(1-p));

  // distribución de tamaños de coro (+ monómeros como tamaño 1)
  const groups=new Map();
  let inCoro=0;
  for(const q of particles){
    if(q.moleculeId){
      groups.set(q.moleculeId,(groups.get(q.moleculeId)||0)+1);
      inCoro++;
    }
  }
  const counts=[];
  for(const sz of groups.values()) counts.push(sz);
  const monomers=Math.max(0, particles.length-inCoro);
  if(monomers) counts.push(...Array(monomers).fill(1));
  // histograma de tamaños → entropía de Shannon
  const freq=new Map();
  for(const c of counts) freq.set(c,(freq.get(c)||0)+1);
  const nC=counts.length||1;
  let S_clus=0;
  for(const f of freq.values()){
    const pi=f/nC;
    if(pi>0) S_clus-=pi*Math.log(pi);
  }
  // si todo es monómero o un solo coro, S_clus baja

  // cinética: bins de rapidez
  let S_kin=0;
  if(particles.length>0){
    const speeds=particles.map(e=>Math.hypot(e.vx||0,e.vy||0,e.vz||0));
    const vmax=Math.max(1e-6, ...speeds);
    const nb=6;
    const bins=new Array(nb).fill(0);
    for(const s of speeds){
      const i=Math.min(nb-1, Math.floor((s/vmax)*nb));
      bins[i]++;
    }
    const n=speeds.length;
    for(const b of bins){
      if(b<=0) continue;
      const pi=b/n;
      S_kin-=pi*Math.log(pi);
    }
  }

  // total ponderado (escala visual ~0–2.5 nats típicos)
  const S=0.45*S_link + 0.35*S_clus + 0.20*S_kin;
  entropyState.S=S;
  entropyState.S_link=S_link;
  entropyState.S_clus=S_clus;
  entropyState.S_kin=S_kin;
  entropyState.pStuck=p;
  entropyState.hist.push(S);
  if(entropyState.hist.length>120) entropyState.hist.shift();
  return entropyState;
}
function drawEntropyOverlay(ctx, W, H){
  const es=entropyState;
  if(!es) return;
  const pad=12;
  const bw=Math.min(160, W*0.28);
  const bh=36;
  const x=pad, y=H-pad-bh-22;
  ctx.save();
  ctx.globalAlpha=0.92;
  // fondo tenue
  ctx.fillStyle='rgba(8,14,28,0.55)';
  ctx.strokeStyle='rgba(140,170,210,0.25)';
  ctx.lineWidth=1;
  roundRect(ctx,x,y,bw,bh+18,8);
  ctx.fill(); ctx.stroke();
  // título
  ctx.font='600 10px Outfit,sans-serif';
  ctx.fillStyle='rgba(160,190,220,0.85)';
  ctx.fillText('entropía S', x+8, y+12);
  ctx.font='500 9px Outfit,sans-serif';
  ctx.fillStyle='rgba(120,150,180,0.75)';
  ctx.fillText('S='+es.S.toFixed(2)+' · link '+es.S_link.toFixed(2)+' · clus '+es.S_clus.toFixed(2), x+8, y+24);
  // barra S normalizada (max teórico ~ ln2 + ln(n) ~ 1.5–2.2)
  const sNorm=Math.min(1, es.S/1.8);
  const barW=(bw-16)*sNorm;
  const gx=x+8, gy=y+30, gh=6, gw=bw-16;
  ctx.fillStyle='rgba(40,60,90,0.8)';
  ctx.fillRect(gx,gy,gw,gh);
  const grad=ctx.createLinearGradient(gx,0,gx+gw,0);
  grad.addColorStop(0,'rgba(80,180,220,0.9)');   // orden (baja S relativa en barra corta)
  grad.addColorStop(0.5,'rgba(200,160,100,0.9)');
  grad.addColorStop(1,'rgba(240,100,140,0.95)'); // desorden
  ctx.fillStyle=grad;
  ctx.fillRect(gx,gy,barW,gh);
  // sparkline historial
  const h=es.hist;
  if(h.length>4){
    const maxS=Math.max(0.2, ...h);
    ctx.strokeStyle='rgba(150,200,255,0.45)';
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<h.length;i++){
      const px=gx+(i/(h.length-1))*gw;
      const py=gy+gh+4+10*(1-h[i]/maxS);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function updateThermalHysteresis(){
  const kT=langevinKT;
  const dk=kT-thermalHys.kTPrev;
  if(Math.abs(dk)>0.0008) thermalHys.dir=dk>0?1:-1;
  thermalHys.peakKT=Math.max(thermalHys.peakKT, kT);
  const order=thermalOrderProxy();
  const prev=thermalHys.orderMem;
  // calentamiento: detectar pérdida de orden (kT_off)
  if(thermalHys.dir>=0 && prev>0.35 && order<prev-0.12 && order<0.28){
    if(thermalHys.kTOff==null || kT>thermalHys.kTOff){
      thermalHys.kTOff=kT;
      if(typeof log==='function') log('Histéresis · kT_off='+kT.toFixed(3)+' (pérdida de orden)');
    }
    thermalHys.wasHot=true;
  }
  if(kT>0.055) thermalHys.wasHot=true;
  // enfriamiento: detectar reaparición (kT_on)
  if(thermalHys.dir<0 && thermalHys.wasHot && order>0.40 && order>prev+0.08){
    if(thermalHys.kTOn==null || Math.abs(thermalHys.kTOn-kT)>0.01){
      thermalHys.kTOn=kT;
      if(typeof log==='function' && thermalHys.kTOff!=null)
        log('Histéresis · kT_on='+kT.toFixed(3)+' · kT_off='+thermalHys.kTOff.toFixed(3)+
            ' · Δ='+(thermalHys.kTOff-kT).toFixed(3));
    }
  }
  // residual: sube con calor, baja lento solo al enfriar en zona fría
  if(thermalHys.dir>0 || kT>0.05){
    thermalHys.residual=Math.min(1, thermalHys.residual+0.02*(kT/0.08)+0.01);
  } else if(kT<0.03 && thermalHys.dir<=0){
    thermalHys.residual=Math.max(0, thermalHys.residual-0.012);
  } else {
    thermalHys.residual=Math.max(0, thermalHys.residual-0.003);
  }
  // reset de ciclo si volvemos a frío profundo con orden
  if(kT<0.025 && order>0.45 && thermalHys.residual<0.08){
    thermalHys.wasHot=false;
    thermalHys.peakKT=kT;
  }
  thermalHys.orderMem=order*0.25+prev*0.75;
  thermalHys.kTPrev=kT;
}

function agarSteer(dt){

  const speed=0.045/(0.7+Math.sqrt(Math.max(0.3,p.mass))*0.35);
  p.vx+= (dx/dist)*speed*0.35;
  p.vy+= (dy/dist)*speed*0.35;
  p.vz*=0.98;
}

/* ─── Tirón de cuerda: atractor dinámico = resultante de la acción (no se materializa) ─── */
const TUG_CORE_KINDS=new Set(['p','A']);
let tugState={active:false, leaderId:null, powers:[], attractor:null};
/* Métricas de energía del campo de almas (análogo a los experimentos numéricos) */
let fieldEnergy={
  E_vivo:0, E_rad:0, frac_core:0, bind:0, H:0,
  nCore:0, nFree:0, nStuck:0, nNuclei:0
};
function computeFieldEnergy(){
  const n=particles.length;
  if(!n){
    fieldEnergy={E_vivo:0,E_rad:0,frac_core:0,bind:0,H:0,nCore:0,nFree:0,nStuck:0,nNuclei:0};
    return fieldEnergy;
  }
  const h=scaleExp.hito||{x:0.5,y:0.5,z:0.5};
  let massTot=0, massR2=0, massCore=0;
  let nStuck=0, nNuclei=0;
  for(const p of particles){
    const m=p.mass||1;
    massTot+=m;
    const dx=p.x-h.x, dy=p.y-h.y, dz=p.z-h.z;
    const r2=dx*dx+dy*dy+dz*dz;
    massR2+=m*r2;
    if(Math.sqrt(r2)<0.30) massCore+=m;
    if(p.moleculeId||p.crystallized) nStuck++;
    if(p.kind==='p'||p.kind==='A') nNuclei++;
  }
  const E_rad=massR2/Math.max(massTot,1e-9);
  const frac_core=massCore/Math.max(massTot,1e-9);
  const nFree=n-nStuck;
  // E_vivo: adheridas / núcleos (residual de dos poblaciones)
  const E_vivo=nNuclei>0?(nStuck/nNuclei):(nStuck>0?nStuck:0);
  // bind: fracción de lazos stuck sobre posibles (aprox)
  let stuckLinks=0, allLinks=0;
  for(const L of softLinks.values()){
    allLinks++;
    if(L.stuck||L.alpha>0.25) stuckLinks++;
  }
  const bind=allLinks>0?stuckLinks/allLinks:(nStuck>0?nStuck/n:0);
  // H ~ dispersión de velocidades (gradiente cinético) + amplitud de masa
  let ke=0;
  for(const p of particles) ke+=0.5*(p.mass||1)*((p.vx||0)**2+(p.vy||0)**2+(p.vz||0)**2);
  const H=ke*40+E_rad*0.5;
  fieldEnergy={E_vivo, E_rad, frac_core, bind, H, nCore:0, nFree, nStuck, nNuclei};
  // nCore particles in ball
  fieldEnergy.nCore=particles.filter(p=>{
    const dx=p.x-h.x,dy=p.y-h.y,dz=p.z-h.z;
    return Math.hypot(dx,dy,dz)<0.30;
  }).length;
  return fieldEnergy;
}

function clusterMass(core){
  let m=core.mass, allies=0;
  for(const p of particles){
    if(p.id===core.id) continue;
    if(core.moleculeId&&p.moleculeId===core.moleculeId){
      m+=p.mass*0.65;
      allies++;
    } else {
      const d=Math.hypot(p.x-core.x,p.y-core.y,p.z-core.z);
      if(d<0.12){
        const qq=(core.charge||0)*(p.charge||0);
        if(qq<=0){ m+=p.mass*0.12; allies+=0.25; }
      }
    }
  }
  return {m, allies};
}
function emergentAttractor(ranked){
  let x=0,y=0,z=0,w=0;
  for(const r of ranked){
    const wt=Math.max(0.15, r.power);
    x+=r.c.x*wt; y+=r.c.y*wt; z+=r.c.z*wt; w+=wt;
    for(const p of particles){
      if(p.id===r.c.id) continue;
      if(r.c.moleculeId&&p.moleculeId===r.c.moleculeId){
        const aw=p.mass*0.35;
        x+=p.x*aw; y+=p.y*aw; z+=p.z*aw; w+=aw;
      }
    }
  }
  if(w<1e-9) return null;
  let ux=0,uy=0,uz=0;
  for(const r of ranked){ ux+=r.c.x; uy+=r.c.y; uz+=r.c.z; }
  const n=ranked.length;
  ux/=n; uy/=n; uz/=n;
  const px=x/w, py=y/w, pz=z/w;
  return {x:px*0.62+ux*0.38, y:py*0.62+uy*0.38, z:pz*0.62+uz*0.38};
}
function updateTugOfWar(){
  const cores=particles.filter(p=>TUG_CORE_KINDS.has(p.kind));
  tugState.active=cores.length>=2;
  tugState.powers=[];
  tugState.attractor=null;
  if(cores.length<2){ tugState.leaderId=null; return; }

  const assembleBias=scale<SCALE_MEAN?(SCALE_MEAN-scale)/SCALE_MEAN:0;
  const disperseBias=scale>SCALE_MEAN?(scale-SCALE_MEAN)/(1-SCALE_MEAN):0;

  const ranked=[];
  for(const c of cores){
    const {m, allies}=clusterMass(c);
    const medium=1+assembleBias*0.55-disperseBias*0.45-(langevinOn?langevinKT*4:0);
    const power=m*Math.max(0.25, medium)*(1+allies*0.08);
    ranked.push({c, power, m, allies});
  }
  ranked.sort((a,b)=>b.power-a.power);
  tugState.powers=ranked.map(r=>({id:r.c.id, power:r.power, kind:r.c.kind}));
  tugState.leaderId=ranked[0].c.id;

  const att=emergentAttractor(ranked);
  tugState.attractor=att;
  if(!att) return;
  const ax=att.x, ay=att.y, az=att.z;
  const totalP=ranked.reduce((s,r)=>s+r.power,0)+1e-6;

  for(const r of ranked){
    const c=r.c;
    const dx=ax-c.x, dy=ay-c.y, dz=az-c.z;
    const dist=Math.hypot(dx,dy,dz)+1e-6;
    const share=r.power/totalP;
    // energía: si el campo está extendido (E_rad alto), tirar más al atractor emergente
    const eBias=1+Math.min(1.2, (fieldEnergy.E_rad||0)*2.2)*(1-(fieldEnergy.frac_core||0));
    const pull=0.0016*(0.4+share*1.15)*eBias;
    c.vx+=dx/dist*pull;
    c.vy+=dy/dist*pull;
    c.vz+=dz/dist*pull;
    if(c.id!==tugState.leaderId){
      const L=ranked[0].c;
      const sx=c.x-L.x, sy=c.y-L.y, sz=c.z-L.z;
      const sd=Math.hypot(sx,sy,sz)+1e-6;
      const push=0.00085*(ranked[0].power/(r.power+0.5));
      c.vx+=sx/sd*push;
      c.vy+=sy/sd*push;
      c.vz+=sz/sd*push;
    }
    const base=kindMeta[c.kind].mass;
    if(assembleBias>0.15&&r.allies>=1){
      // en vez de crecer de tamaño: reforzar lazos no consolidados del núcleo
      const gain=Math.min(0.012*assembleBias*(0.5+r.allies*0.15), 0.01);
      if(gain>0.0005) strengthenNascentLinks(c, gain*2.5);
    } else if(disperseBias>0.25&&r.allies<0.5){
      const loss=Math.min(Math.max(0, c.mass-base*0.55), 0.01*disperseBias);
      if(loss>0.0008){
        // masa conceptual → residual; tamaño visual no cambia
        c.mass-=loss;
        residualMass+=loss;
        if(c.mass<base*0.85){
          c.crystallized=false;
          for(const [k,L] of softLinks){
            if(L.a===c.id||L.b===c.id){ L.stuck=false; L.target*=0.5; if(typeof notePlay==='function') notePlay('dissolve'); }
          }
          if(c.moleculeId){
            const mid=c.moleculeId;
            c.moleculeId=null;
            for(const p of particles) if(p.moleculeId===mid&&p.id!==c.id) p.moleculeId=null;
          }
        }
      }
    }
  }
}

/* Adhesión: dos fundamentales se pegan; ninguna desaparece ni cambia de tipo */
function adhereParticles(a,b,reason='afinidad'){
  if(!a||!b||a.id===b.id) return false;
  const k=linkKey(a.id,b.id);
  if(!softLinks.has(k)) softLinks.set(k,{a:a.id,b:b.id,alpha:0.25,target:0.55,lineage:sameLineage(a,b),stuck:true});
  const L=softLinks.get(k);
  L.stuck=true; if(L.stuckSince==null) L.stuckSince=time; L.stuckSince=time;
  L.target=Math.max(L.target||0,0.58);
  L.alpha=Math.max(L.alpha||0,0.42);
  L.lineage=L.lineage||sameLineage(a,b);
  const mol=a.moleculeId||b.moleculeId||('agg'+(nextId++));
  a.moleculeId=mol; b.moleculeId=mol;
  a.crystallized=true; b.crystallized=true;
  a.crystalStreak=CRYSTAL_TIME; b.crystalStreak=CRYSTAL_TIME;
  a.memory=(a.memory||0)+0.4; b.memory=(b.memory||0)+0.4;
  a.relEnergy=(a.relEnergy||0)+0.05; b.relEnergy=(b.relEnergy||0)+0.05;
  // acortar distancia de inmediato y unificar velocidad (trayectoria compartida)
  const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
  const d=Math.hypot(dx,dy,dz)+1e-9;
  const target=sepIdealWorld(a,b); // 2.5 unidades entre enlazadas
  if(d>target){
    const t=(d-target)/d*0.45;
    a.x+=dx*t*0.5; a.y+=dy*t*0.5; a.z+=dz*t*0.5;
    b.x-=dx*t*0.5; b.y-=dy*t*0.5; b.z-=dz*t*0.5;
  }
  const cvx=(a.vx+b.vx)*0.5, cvy=(a.vy+b.vy)*0.5, cvz=(a.vz+b.vz)*0.5;
  a.vx=cvx*0.85+a.vx*0.15; a.vy=cvy*0.85+a.vy*0.15; a.vz=cvz*0.85+a.vz*0.15;
  b.vx=cvx*0.85+b.vx*0.15; b.vy=cvy*0.85+b.vy*0.15; b.vz=cvz*0.85+b.vz*0.15;
  spawnFlash((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2,(a.hue+b.hue)/2,1.05,'capture');
  log('Agencia · '+kindMeta[a.kind].name+' #'+a.id+' ⟂ '+kindMeta[b.kind].name+' #'+b.id+' · '+reason);
  return true;
}
function releaseBond(aId,bId){
  const k=linkKey(aId,bId);
  const L=softLinks.get(k);
  if(!L) return;
  if(L.stuck&&L.stuckSince!=null) recordStuckLifetime(time-L.stuckSince);
        L.stuck=false; L.target=0; L.stuckSince=null;
  const byId=new Map(particles.map(p=>[p.id,p]));
  const a=byId.get(aId), b=byId.get(bId);
  if(a){ a.crystalStreak=0; }
  if(b){ b.crystalStreak=0; }
}
function agarEat(){
  // agar: adhesión al cluster del jugador (no fagocitar/borrar)
  const p=getPlayer();
  if(!p||!agarOn) return;
  const eatR=AGAR_EAT_RAD*(0.85+0.12*Math.sqrt(p.mass));
  for(const o of particles){
    if(!o||o.id===p.id) continue;
    if(p.moleculeId&&o.moleculeId===p.moleculeId) continue; // ya adherida
    if(p.mass < o.mass*AGAR_EAT_RATIO) continue;
    const dist=Math.hypot(o.x-p.x,o.y-p.y,o.z-p.z);
    if(dist>eatR) continue;
    if(adhereParticles(p,o,'agar')){
      if(typeof notePlay==='function') notePlay('fago');
    }
  }
}
function agarSplit(){
  // Space = soltar una unidad adherida (no dividir la partícula fundamental)
  const p=getPlayer();
  if(!p) return;
  let released=false;
  for(const [k,L] of softLinks){
    if(L.a!==p.id&&L.b!==p.id) continue;
    if(!L.stuck&&L.alpha<0.2) continue;
    const otherId=L.a===p.id?L.b:L.a;
    const o=particles.find(x=>x.id===otherId);
    releaseBond(L.a,L.b);
    if(o){
      const ang=pointerAim?Math.atan2(pointerAim.ny-0.5,pointerAim.nx-0.5):Math.random()*Math.PI*2;
      o.vx+=Math.cos(ang)*0.1; o.vy+=Math.sin(ang)*0.1;
      o.crystallized=false; o.moleculeId=null;
      p.vx-=Math.cos(ang)*0.04; p.vy-=Math.sin(ang)*0.04;
      log('Suelta · #'+p.id+' libera #'+o.id);

}

/* ==================================================================
   NÚCLEO CONCEPTUAL: mantissa α_n = φ + Δα_n
   ESTADO(R_n) → RELACIÓN F(π,φ,R_n,E_n) → RESIDUAL(α_n+1)
   Acá R_n es el residuo físico real del campo de interferencia

const PHI=1.6180339887498949, PHI_FRAC=0.6180339887498949; // φ y frac(φ)

const deltaAlphaHistory=[];

/* Observador = emisor: cono de influencia (fuga) desde el último acto
   1 emisor | 2 cono / relaciones | 3 residual */
const observerEmit={
  x:0.5, y:0.5, z:0.5,
  strength:0,      // 0..1 intensidad de la fuga visible
  life:0,          // decae con el tiempo
  kind:'hito',     // 'spawn' | 'drag' | 'hito'

function noteEmission(x,y,z, strength, kind){
  if(typeof x!=='number'||!Number.isFinite(x)) return;
  observerEmit.x=x; observerEmit.y=y; observerEmit.z=z??0.5;
  observerEmit.strength=Math.min(1, Math.max(observerEmit.strength*0.35, strength||0.4));

function updateObserverEmit(dt){
  observerEmit.age+=(dt||0.045);
  // la fuga decae; el residual queda en impulse del medio
  observerEmit.life=Math.max(0, observerEmit.life-0.012);
  observerEmit.strength*=0.985;
  if(observerEmit.life<=0.02) observerEmit.strength*=0.9;
  // si no hay emisión reciente, el cono reposa en el hito (perspectiva del punto)
  if(observerEmit.life<0.15 && typeof getScaleHito==='function'){
    const h=getScaleHito();
    const lerp=0.04;
    observerEmit.x+=(h.x-observerEmit.x)*lerp;
    observerEmit.y+=(h.y-observerEmit.y)*lerp;
    observerEmit.z+=(h.z-observerEmit.z)*lerp;
    if(observerEmit.kind!=='hito' && observerEmit.life<0.05) observerEmit.kind='hito';
  }
}
/** Fuga vs retención (lectura del cono)
    fuga ≈ J_eff + life del emisor + S relativa
    retención ≈ bind + stuck + masa en coros */
function computeFugaRetencion(){
  const ie=typeof getImpulseEff==='function'?getImpulseEff():impulse;
  const fuga=Math.min(1,
    0.40*Math.min(1,ie/0.6)+
    0.35*observerEmit.strength*observerEmit.life+
    0.25*Math.min(1,(entropyState?.S||0)/1.6)
  );
  let nStuck=0, nCoro=0, mCoro=0, mAll=0;
  for(const L of softLinks.values()) if(L.stuck) nStuck++;
  for(const p of particles){
    mAll+=p.mass||0;
    if(p.moleculeId){ nCoro++; mCoro+=p.mass||0; }
  }
  const bind=softLinks.size?nStuck/Math.max(1,softLinks.size):0;
  const ret=Math.min(1,
    0.40*bind+
    0.35*(mAll>0?mCoro/mAll:0)+
    0.25*Math.min(1,nStuck/12)
  );
  return {fuga, retencion:ret, ratio:fuga/(ret+1e-6)};
}

/* Potencial angular en triples stuck: V = ½ kθ (θ − θ₀)²

const ANGLE_K0=0.016; // base angular
function angleKEffective(){

function theta0ForKind(kind){
  // tetraédrico ~109.5°, trigonal ~120°, default ~105°
  if(kind==='p'||kind==='A'||kind==='X') return Math.acos(-1/3);

function applyAngularForces(){

    if(!nb.has(L.a)) nb.set(L.a,[]);
    if(!nb.has(L.b)) nb.set(L.b,[]);

  for(const [cid, neigh] of nb){

    const invMc=1/Math.max(0.2,c.mass);
    // limitar pares angulares para no O(z²) explosivo
    const z=Math.min(neigh.length, 6);
    for(let i=0;i<z;i++){
      for(let j=i+1;j<z;j++){
        const a=byId.get(neigh[i]), b=byId.get(neigh[j]);
        if(!a||!b) continue;
        // vectores desde el centro c hacia a y b
        let rix=a.x-c.x, riy=a.y-c.y, riz=a.z-c.z;
        let rjx=b.x-c.x, rjy=b.y-c.y, rjz=b.z-c.z;

        rix/=ri; riy/=ri; riz/=ri;
        rjx/=rj; rjy/=rj; rjz/=rj;
        let cos=rix*rjx+riy*rjy+riz*rjz;
        cos=Math.max(-0.999,Math.min(0.999,cos));
        const theta=Math.acos(cos);
        const dTheta=theta-theta0;
        if(Math.abs(dTheta)<0.02) continue;
        // fuerza tipo GROMACS/angle: derivados respecto a posiciones
        const sin=Math.sqrt(Math.max(1e-8,1-cos*cos));
        const k=angleKEffective()*(c.crystallized?1.25:1)*(0.7+0.3*(c.moleculeId?1:0));
        const forceMag=-k*dTheta; // hacia θ₀
        // d(theta)/d cos = -1/sin
        const pref=forceMag/sin;
        // grad cos w.r.t. unit vectors → fuerzas sobre a, b, c
        // ∂cos/∂ri_hat = rj_hat, etc.
        let fax=(pref/ri)*(rjx-cos*rix);
        let fay=(pref/ri)*(rjy-cos*riy);
        let faz=(pref/ri)*(rjz-cos*riz);
        let fbx=(pref/rj)*(rix-cos*rjx);
        let fby=(pref/rj)*(riy-cos*rjy);
        let fbz=(pref/rj)*(riz-cos*rjz);
        // acción-reacción en el centro
        let fcx=-(fax+fbx), fcy=-(fay+fby), fcz=-(faz+fbz);
        // clamp
        const lim=0.012;
        const clamp3=(x,y,z)=>{
          const m=Math.hypot(x,y,z);
          if(m>lim){ const s=lim/m; return [x*s,y*s,z*s]; }
          return [x,y,z];
        };
        [fax,fay,faz]=clamp3(fax,fay,faz);
        [fbx,fby,fbz]=clamp3(fbx,fby,fbz);
        [fcx,fcy,fcz]=clamp3(fcx,fcy,fcz);
        const invMa=1/Math.max(0.2,a.mass);
        const invMb=1/Math.max(0.2,b.mass);
        a.ax+=fax*invMa; a.ay+=fay*invMa; a.az+=faz*invMa;
        b.ax+=fbx*invMb; b.ay+=fby*invMb; b.az+=fbz*invMb;
        c.ax+=fcx*invMc; c.ay+=fcy*invMc; c.az+=fcz*invMc;
      }
    }
  }
}

/** Constraint tipo SHAKE suave: stuck a exactamente sepIdeal (2.5 cuerpos) */
function constrainStuckBonds(){
  const byId=new Map(particles.map(p=>[p.id,p]));
  for(let iter=0; iter<2; iter++){
    for(const L of softLinks.values()){
      if(!L.stuck||L.alpha<0.08) continue;
      const a=byId.get(L.a), b=byId.get(L.b);
      if(!a||!b) continue;
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      const dist=Math.hypot(dx,dy,dz)+1e-9;
      const ideal=sepIdealWorld(a,b);
      const err=dist-ideal;
      if(Math.abs(err)<0.0008) continue;
      const corr=err*0.52; // fracción de corrección por iteración
      const inv=corr/dist;
      const ma=Math.max(0.2,a.mass), mb=Math.max(0.2,b.mass);
      const wa=mb/(ma+mb), wb=ma/(ma+mb);
      a.x+=dx*inv*wa; a.y+=dy*inv*wa; a.z+=dz*inv*wa;
      b.x-=dx*inv*wb; b.y-=dy*inv*wb; b.z-=dz*inv*wb;
      // anular componente relativa de velocidad a lo largo del lazo (RATTLE light)
      const rvx=a.vx-b.vx, rvy=a.vy-b.vy, rvz=a.vz-b.vz;
      const vn=(rvx*dx+rvy*dy+rvz*dz)/dist;
      const damp=0.35;
      a.vx-=(vn*dx/dist)*damp*wa; a.vy-=(vn*dy/dist)*damp*wa; a.vz-=(vn*dz/dist)*damp*wa;
      b.vx+=(vn*dx/dist)*damp*wb; b.vy+=(vn*dy/dist)*damp*wb; b.vz+=(vn*dz/dist)*damp*wb;
    }
  }
}

const METRICS_WINDOW=150, PRED_EPS_BASE=0.012, PRED_SENS=0.55;

/* Observación: precisión/nulo/mejora dependían directamente del Umbral y el
   Alcance del vínculo porque el epsilon de "acierto" era un número fijo,
   ajeno a la escala real de R_n bajo esos parámetros. Ahora ε se adapta a la
   varianza reciente de R_n, así la métrica deja de ser un artefacto de las
   perillas y mide algo más comparable entre configuraciones. */
function adaptiveEpsilon(){
  if(rObsHistoryForEps.length<8) return PRED_EPS_BASE;
  const mean=rObsHistoryForEps.reduce((a,b)=>a+b,0)/rObsHistoryForEps.length;
  const variance=rObsHistoryForEps.reduce((a,b)=>a+(b-mean)*(b-mean),0)/rObsHistoryForEps.length;
  return Math.max(0.006, Math.sqrt(variance)*0.6);
}

function meanAbsInterf(){

function classifyMantissa(newDelta, magTrend){
  // RESONANCIA: Δα converge y permanece cerca de 0 (el sistema se asienta en φ)
  if(deltaAlphaHistory.length>=24){
    const recent=deltaAlphaHistory.slice(-24);
    const allNearPhi=recent.every(v=>Math.abs(v)<0.05);
    const mean=recent.reduce((a,b)=>a+b,0)/recent.length;
    const variance=recent.reduce((a,b)=>a+(b-mean)*(b-mean),0)/recent.length;
    if(allNearPhi && variance<0.0006) return 'RESONANCIA';
  }
  // MEMORIA: Δα vuelve a una magnitud/signo que ya tuvo en el historial
  if(deltaAlphaHistory.length>=40){
    for(let k=20;k<deltaAlphaHistory.length-5;k++){
      const past=deltaAlphaHistory[deltaAlphaHistory.length-1-k];
      if(Math.abs(past-newDelta)<0.01) return 'MEMORIA';
    }
  }
  if(magTrend>0.004) return 'EXPANSIÓN';
  if(magTrend<-0.004) return 'CONTRACCIÓN';
  return '—';
}

// Barriers for tunneling / double-slit (planes in unit cube)
let barriers=[]; // {x0,x1,y0,y1,z0,z1} boxes that reflect/attenuate

/* Caja contenedora real de los rebotes, visualizada como dodecaedro regular
   (levemente visible) en vez de un cubo invisible implícito. */
function buildDodecahedron(scaleR){
  const P=1.6180339887498949, inv=1/P;
  const raw=[];
  for(const sx of [1,-1]) for(const sy of [1,-1]) for(const sz of [1,-1]) raw.push([sx,sy,sz]);
  for(const sy of [1,-1]) for(const sz of [1,-1]) raw.push([0, sy*inv, sz*P]);
  for(const sx of [1,-1]) for(const sy of [1,-1]) raw.push([sx*inv, sy*P, 0]);
  for(const sx of [1,-1]) for(const sz of [1,-1]) raw.push([sx*P, 0, sz*inv]);
  const circ=Math.sqrt(3);
  const verts=raw.map(([x,y,z])=>[x/circ*scaleR, y/circ*scaleR, z/circ*scaleR]);
  let minD=Infinity;
  for(let i=0;i<verts.length;i++) for(let j=i+1;j<verts.length;j++){
    const d=Math.hypot(verts[i][0]-verts[j][0],verts[i][1]-verts[j][1],verts[i][2]-verts[j][2]);
    if(d<minD) minD=d;
  }
  const edges=[];
  for(let i=0;i<verts.length;i++) for(let j=i+1;j<verts.length;j++){
    const d=Math.hypot(verts[i][0]-verts[j][0],verts[i][1]-verts[j][1],verts[i][2]-verts[j][2]);
    if(d<minD*1.02) edges.push([i,j]);
  }
  return {verts,edges};
}
/* Escala ajustada al cubo de la grilla unitaria (~[-0.5,0.5]^3 proyectado):
   el inradius del dodecaedro regular normalizado ≈ 0.79 del circumradius,
   aquí usamos 0.48 para que coincida visualmente con los límites 0.02–0.98. */
/* Espacio de movimiento duplicado: lado 2, centro 0.5 → [-0.5, 1.5]^3 */
const WORLD_MIN=-0.5, WORLD_MAX=1.5, WORLD_CENTER=0.5, WORLD_SIZE=2;
const DODECA=buildDodecahedron(0.96);

/* Normales de las 12 caras (direcciones de vértice de un icosaedro dual) +
   función de rebote real: la caja contenedora deja de ser un cubo invisible
   y pasa a ser el propio dodecaedro dibujado. */
function dodecaFaceNormals(){
  const P=1.6180339887498949;
  const raw=[];
  for(const sy of [1,-1]) for(const sz of [1,-1]) raw.push([0,sy,sz*P]);
  for(const sx of [1,-1]) for(const sy of [1,-1]) raw.push([sx,sy*P,0]);
  for(const sx of [1,-1]) for(const sz of [1,-1]) raw.push([sx*P,0,sz]);
  return raw.map(([x,y,z])=>{const l=Math.hypot(x,y,z);return [x/l,y/l,z/l];});
}
const DODEC_NORMALS=dodecaFaceNormals();
const DODEC_INRADIUS=Math.max(...DODECA.verts.map(v=>v[0]*DODEC_NORMALS[0][0]+v[1]*DODEC_NORMALS[0][1]+v[2]*DODEC_NORMALS[0][2]));

function reflectOffDodecahedron(e){
  const rx=e.x-0.5, ry=e.y-0.5, rz=e.z-0.5;
  for(const n of DODEC_NORMALS){
    const dist=rx*n[0]+ry*n[1]+rz*n[2];
    if(dist>DODEC_INRADIUS){
      const over=dist-DODEC_INRADIUS;
      e.x-=n[0]*over; e.y-=n[1]*over; e.z-=n[2]*over;
      const vn=e.vx*n[0]+e.vy*n[1]+e.vz*n[2];
      if(vn>0){
        e.vx-=1.85*vn*n[0]; e.vy-=1.85*vn*n[1]; e.vz-=1.85*vn*n[2];
        // pequeña onda gris efímera al atravesar/rebotar una cara
        spawnFaceWave(e.x,e.y,e.z);
        emitDust(e.x,e.y,e.z,2,0.01);
      }
    }
  }
  // caja de rebotes (límites fantasma del cubo de la grilla) — se activan al contacto
  const margin=0.04;
  let hitFace=null;
  if(e.x<WORLD_MIN+margin){ e.x=WORLD_MIN+margin; if(e.vx<0){e.vx*=-0.88; hitFace='x-';} }
  else if(e.x>WORLD_MAX-margin){ e.x=WORLD_MAX-margin; if(e.vx>0){e.vx*=-0.88; hitFace='x+';} }
  if(e.y<WORLD_MIN+margin){ e.y=WORLD_MIN+margin; if(e.vy<0){e.vy*=-0.88; hitFace='y-';} }
  else if(e.y>WORLD_MAX-margin){ e.y=WORLD_MAX-margin; if(e.vy>0){e.vy*=-0.88; hitFace='y+';} }
  if(e.z<WORLD_MIN+margin){ e.z=WORLD_MIN+margin; if(e.vz<0){e.vz*=-0.88; hitFace='z-';} }
  else if(e.z>WORLD_MAX-margin){ e.z=WORLD_MAX-margin; if(e.vz>0){e.vz*=-0.88; hitFace='z+';} }
  if(hitFace){
    spawnCubeHit(e.x,e.y,e.z,hitFace);
    emitDust(e.x,e.y,e.z,4,0.018);
    // doble rendija: estadísticas de rebotes en el lado posterior a la placa
    if(doubleSlitStats.active && e.x>0.55){
      doubleSlitStats.rearHits++;
      const bin=Math.max(0,Math.min(23,((e.y-0.08)/0.84*24)|0));
      doubleSlitStats.bins[bin]++;
    }
  }
}

/* Cristalización molecular: 3+ elementos con vínculos fuertes y sostenidos se
   funden en una "molécula" reconocible. Fisiona ante otra fuerza: impacto de
   fotón (γ) o un pico de perturbación ambiental (shock mecánico/térmico). */
/* Cristalización más accesible: umbral de vínculo más bajo y tiempo más corto
   para que los clusters formen moléculas (moles) con facilidad bajo umbral media. */
const CRYSTAL_ALPHA=0.09, CRYSTAL_TIME=0.55, FISSION_IMPULSE=0.50; // umbral J_eff zona caliente
/* Disolución de lazos (3 fases):
   1) fatiga — velo/impulso moderados erosionan target del stuck
   2) ruptura — disperseBias ≥ STUCK_BREAK_BIAS (scale ≳ 0.68) o impulseEff ≥ FISSION_IMPULSE
   3) decaimiento — alpha cae rápido al soltar; moleculeId solo si no quedan stuck
   Marea suma al impulse efectivo. */
const STUCK_BREAK_BIAS=0.36;
const STUCK_FATIGUE_NEED=1.0;
const FAGO_RADIUS=0.12, FAGO_COOLDOWN=1.6, FAGO_DWELL=0.32; // fagocitosis jugable (radio, dwell y cooldown)

/* ─── Jerarquía de ensamble: subpartículas → átomo → molécula ───
   Nivel 1 (síntesis): 2 a 5 subpartículas (e,p,n,γ) con vínculo fuerte
   sostenido se fusionan en UN átomo (H/A/X/Ψ según cuántas se unieron).
   Nivel 2 (cristalización, más abajo en updateMolecules): sólo átomos
   ya sintetizados (H,A,X,Ψ) pueden cristalizar juntos en una molécula —
   las subpartículas sueltas ya no cristalizan directo, primero deben
   fusionarse. Ambos niveles obedecen el mismo sesgo de Umbral vs media. */
const SUBATOMIC_KINDS=new Set(['e','p','n','γ']);
const ATOM_TIER_KINDS=new Set(['H','A','X','Ψ','φ']);
const SYNTH_ALPHA=0.075, SYNTH_TIME=0.4, SYNTH_MIN=2, SYNTH_MAX=5;
/* Producto de fusión según composición (no solo el conteo):
   la mayoría de dímeros eran n=2 → siempre H; ahora depende de cargas, carga y masa. */
function lineageOf(p){
  return p.lineage||p._fromSplit||null;
}
function sameLineage(a,b){
  const la=lineageOf(a), lb=lineageOf(b);
  if(la&&lb&&la===lb) return true;
  if(a._fromSplit&&a._fromSplit===b.kind) return true;
  if(b._fromSplit&&b._fromSplit===a.kind) return true;
  return false;
}
/* Fusión de linajes: si la mayoría de los miembros viene del mismo ancestro
   (p. ej. fragmentos de Umbra), la conjunción restaura ese ancestro. */
function fusionKindFromMembers(members){
  const lineageVotes={};
  for(const p of members){
    const L=lineageOf(p);
    if(L) lineageVotes[L]=(lineageVotes[L]||0)+1;
  }
  let best=null, bestN=0;
  for(const [k,n] of Object.entries(lineageVotes)) if(n>bestN){ best=k; bestN=n; }
  const n=members.length;
  if(best&&bestN>=Math.ceil(n*0.5)&&ATOM_TIER_KINDS.has(best)){
    return {kind:best, lineageRestore:true, root:best};
  }

  const counts={e:0,p:0,n:0,γ:0};
  let charge=0, mass=0;
  for(const p of members){
    if(counts[p.kind]!=null) counts[p.kind]++;
    charge+=(p.charge||0);
    mass+=p.mass;
  }
  let kind;
  if(counts.p>=1&&counts.e>=1&&counts.n===0&&counts.γ===0&&n<=3) kind='H';
  else if(counts.γ>=2&&counts.e+counts.p+counts.n<=1) kind='φ';
  else if(counts.n>=1&&counts.p>=1&&n>=3) kind='X';
  else if(Math.abs(charge)>=2||(counts.p>=2&&n>=3)) kind='A';
  else if(counts.e>=2&&counts.p===0&&mass<4) kind='Ψ';
  else if(counts.γ>=1&&counts.e>=1&&counts.p===0) kind='Ψ';
  else if(counts.n>=2) kind='X';
  else if(counts.p>=1&&counts.n>=1) kind='A';
  else if(n>=5) kind=mass>8?'A':'Ψ';
  else if(n===4) kind=charge>0?'X':(charge<0?'Ψ':'φ');
  else if(n===3) kind=charge>=1?'A':(charge<=-1?'Ψ':'φ');
  else if(counts.p&&counts.γ) kind='A';
  else if(counts.n&&counts.e) kind='X';
  else if(counts.n&&counts.γ) kind='φ';
  else if(counts.e&&counts.γ) kind='Ψ';
  else if(counts.p&&counts.n) kind='A';
  else {
    const pool=charge>0?['A','X','H']:charge<0?['Ψ','H','φ']:['φ','H','A','X'];
    kind=pool[(Math.random()*pool.length)|0];
  }
  return {kind, lineageRestore:false, root:best};
}
/* Agencia por afinidad: las fundamentales se adhieren en cluster; no fusionan tipos */
function updateSynthesis(byId){
  const assembleBias=scale<SCALE_MEAN ? (SCALE_MEAN-scale)/SCALE_MEAN : 0;
  if(assembleBias<=0) return;
  for(const L of softLinks.values()){
    if(L.alpha<SYNTH_ALPHA) continue;
    const pa=byId.get(L.a), pb=byId.get(L.b);
    if(!pa||!pb) continue;
    if(pa.moleculeId&&pa.moleculeId===pb.moleculeId&&L.stuck) continue;
    // dwell de agencia sobre el vínculo fuerte
    L.agency=(L.agency||0)+0.04+assembleBias*0.05;
    if(L.agency>=0.45){
      adhereParticles(pa,pb,'conjunción');
      L.agency=0;
      if(typeof notePlay==='function') notePlay('fusion', pa.kind);
    }
  }
}
